# Site de documentation de card. Construction : `mkdocs serve` en local,
# `.github/workflows/site.yml` en ligne.
#
# Deux règles à ne pas défaire, chacune apprise à ses dépens :
#
# - `exclude_docs` tient la liste de ce qui vit dans `docs/` sans partir
#   sur le site. Un générateur ramasse volontiers ce qu'on ne lui demande
#   pas : pkgdown a publié le CLAUDE.md de card4r, et une action en
#   `clean: false` a continué de servir un fichier qui n'était plus
#   produit. Vérifier ce que la branche publiée contient VRAIMENT.
# - `docs/dev/` reste dans le dépôt et hors du site. Les rouages sont
#   lisibles sur GitHub, ce qui est un coût d'entrée légitime ; les y
#   publier ferait du site une vitrine de chantier au lieu d'une porte.

site_name: card
site_description: >-
  Ready-to-use hydroclimatic variables, defined by YAML cards and computed
  the same way from Python, from R or over the web.
site_url: https://lou-heraut.github.io/card/
repo_url: https://github.com/lou-heraut/card
repo_name: lou-heraut/card
edit_uri: ""

copyright: >-
  INRAE, UR RiverLy &middot; GPL-3.0-or-later

# Les fichiers restent dans le dépôt, ils ne partent pas sur le site.
exclude_docs: |
  dev/
  CARDS.md
  CARDS.fr.md

# Les pages de fiche sont hors du plan À DESSEIN : deux cent et quelques
# entrées ne se parcourent pas dans une barre latérale, on y arrive par
# le catalogue. Sans cette déclaration, chaque construction les liste une
# à une en disant qu'elles manquent au plan.
not_in_nav: |
  cards/

theme:
  name: material
  language: en
  favicon: img/flower_alt.png
  logo: img/flower_alt.png
  # Les fontes du système, jamais celles de Google : sans cette ligne,
  # Material va les chercher chez un tiers à chaque visite.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
  # UN SEUL univers, sombre, celui de la page /docs de card-api. Pas de
  # bascule jour/nuit : deux thèmes sont deux choses à tenir, et celui-ci
  # est une identité, pas une préférence. Material a besoin de `slate`
  # pour partir de ses gris sombres ; la gamme exacte est posée par
  # docs/assets/theme.css, qui tranche parce qu'il est chargé après.
  palette:
    scheme: slate
    primary: custom
    accent: custom

# Trois blocs, trois questions, et c'est le plan qui doit les faire voir :
# ce que je peux calculer, comment je m'en sers, où ça vit. Une liste
# plate de six pages ne dit rien de leurs rapports, et le lecteur ne sait
# pas si « Ecosystem » est un chapitre ou une annexe.
#
# Les fiches ont chacune leur page, engendrée dans `docs/cards/` par
# scripts/generate_catalog.py : deux cent et quelques entrées n'ont rien
# à faire dans un plan, on y arrive par le catalogue.
nav:
  - Home: index.md
  - The collection:
      - Catalogue: catalogue.md
      - Symbols: symbols.md
      - Toolbox: toolbox.md
      - Write your own card: contribute.md
  - Using card:
      - Python functions: functions.md
      - Ecosystem and provenance: ecosystem.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # Ce que le site montre d'une fonction est ce que `help()`
            # montre, rendu en pages : la signature, la docstring NumPy,
            # rien de la machinerie. Pas de code source déplié, pas de
            # membres privés : un hydrologue vient lire ce que fait
            # `baseflow(method="Wal")`, pas parcourir un module.
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# L'identité d'abord, le catalogue ensuite : la seconde feuille lit la
# gamme posée par la première, et tranche sur ce qui la concerne.
extra_css:
  - assets/theme.css
  - assets/catalogue.css
extra_javascript:
  - assets/catalogue.js
