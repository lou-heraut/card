# Correspondances du corpus vers les vocabulaires EXTERNES, et vers les
# concepts que card doit définir lui-même faute d'équivalent.
#
# Ce fichier ne porte QUE ce qui n'est pas dérivable des fiches. Tout le
# reste (libellés, unités, facettes, méthode, version, swhid) se lit dans
# les fiches, et rien n'est recopié ici. Cf. docs/dev/PLAN_SITE_SKOS.md,
# section « Tous les champs du thésaurus, et d'où vient chacun ».
#
# Les URIs de `theia` ont été RELEVÉES sur leur service, pas devinées :
#   https://in-situ.theia-land.fr/skosmos/rest/v1/theia_ozcar_thesaurus/
# Elles sont vérifiées par tests/test_alignments.py, qui les résout.

namespaces:
  skos:  http://www.w3.org/2004/02/skos/core#
  iop:   https://w3id.org/iadopt/ont/
  dcterms: http://purl.org/dc/terms/
  owl:   http://www.w3.org/2002/07/owl#
  rdfs:  http://www.w3.org/2000/01/rdf-schema#
  theia: https://w3id.org/ozcar-theia/
  qudt:  http://qudt.org/schema/qudt/
  unit:  http://qudt.org/vocab/unit/
  quantitykind: http://qudt.org/vocab/quantitykind/
  time:  http://www.w3.org/2006/time#
  xsd:   http://www.w3.org/2001/XMLSchema#
  vann:  http://purl.org/vocab/vann/
  # Les noms normalisés des conventions Climate & Forecast, servis en RDF
  # par le serveur de vocabulaires du NERC. C'est le vocabulaire le plus
  # employé du domaine, et il donne aussi l'unité canonique de chaque nom,
  # ce qui permet de VÉRIFIER les nôtres au lieu de les affirmer.
  cfname: http://vocab.nerc.ac.uk/standard_name/

# ── UNITÉS ────────────────────────────────────────────────────────────
#
# Une par unité DISTINCTE du corpus, et le linter refuse une unité qui
# n'y figure pas. Rien n'est deviné à la génération : un code d'unité
# calculé depuis une chaîne serait le piège d'`operator`, une valeur que
# rien ne vérifie.
#
# Deux vocabulaires, et ils ne font pas la même chose (mesuré le
# 2026-08-13, cf. PLAN_SITE_SKOS.md) :
#
#   UCUM  est une GRAMMAIRE : tout se compose, y compris `hm3` et
#         `m3.s-1.mm-1`, que personne n'a eu à prévoir.
#   QUDT  est une LISTE de 2 575 unités nommées, avec URI résolvable,
#         conversions et grandeur. Trois des nôtres n'y sont pas.
#
# D'où les deux champs. `qudt` désigne l'unité de QUDT quand elle
# existe ; sinon card définit la sienne, à partir du seul code UCUM, et
# c'est la même doctrine que pour les contraintes.
#
# `kind` est la GRANDEUR, et elle se déclare : une unité de QUDT en
# porte souvent plusieurs (`M3-PER-SEC` en déclare quatre, dont
# « vitesse volumique du son »), donc elle ne se déduit pas de l'unité.
#
# `value_type` est pour ce qui n'EST PAS une unité. Un jour de l'année
# est une position dans un cycle, pas une mesure : OWL-Time le nomme
# `time:dayOfYear`. Le corpus le dit déjà autrement, ces variables
# portant `is_date: true` et `aspect: timing`.
units:
  "m^{3}.s^{-1}":
    ucum: m3.s-1
    qudt: unit:M3-PER-SEC
    kind: quantitykind:VolumeFlowRate
  mm:
    ucum: mm
    qudt: unit:MilliM
    kind: quantitykind:Length
  "°C":
    ucum: Cel
    qudt: unit:DEG_C
    kind: quantitykind:Temperature
  day:
    ucum: d
    qudt: unit:DAY
    kind: quantitykind:Time
  year:
    ucum: a
    qudt: unit:YR
    kind: quantitykind:Time
  "%":
    ucum: "%"
    qudt: unit:PERCENT
    kind: quantitykind:DimensionlessRatio
  # `unit:UNITLESS` n'a PAS de code UCUM ; c'est `unit:NUM` qui porte `1`.
  without unit:
    ucum: "1"
    qudt: unit:NUM
    kind: quantitykind:Dimensionless
  # Les trois suivantes n'ont pas de concept chez QUDT : card définit le
  # sien, et le code UCUM reste valide et calculable.
  "hm^{3}":
    ucum: hm3
    kind: quantitykind:Volume
  "m^{3}.s^{-1}.year^{-1}":
    ucum: m3.s-1.a-1
  "m^{3}.s^{-1}.mm^{-1}":
    ucum: m3.s-1.mm-1
  yearday:
    value_type: time:dayOfYear
  bool:
    value_type: xsd:boolean

# ── Variables d'ENTRÉE ────────────────────────────────────────────────
#
# I-ADOPT exige exactement une propriété et un objet d'intérêt. Ils vont
# donc par PAIRE, et non par deux tables séparées : `R` n'est pas « la
# propriété précipitation », c'est « un volume par unité de surface, de
# la précipitation ».
#
# `same_as` désigne la VARIABLE équivalente chez eux, quand elle existe :
# c'est l'alignement proprement dit, `hasProperty` et `hasObjectOfInterest`
# n'étant que les composants dont card se sert pour bâtir les siennes.
#
# `provenance` dit d'où vient la série : observée ou simulée. Ce n'est
# PAS un composant de la variable, et le thésaurus ne le publie pas.
#
# Il s'est d'abord appelé `role`, avec les valeurs `source` et `target`,
# en visant l'`AsymmetricSystem` d'I-ADOPT. C'était un contresens,
# constaté le 2026-08-13 en lisant leur ontologie : `hasSource` et
# `hasTarget` y désignent la source et le puits d'un FLUX, pas l'observé
# et le simulé. Le nom a donc changé pour cesser de promettre un terme
# standard qui ne dit pas ça, et l'information reste ici parce qu'elle
# documente le registre, pas parce qu'elle sortira un jour en RDF : le
# nom et la description de chaque variable la disent déjà en toutes
# lettres.
inputs:
  # `River` et non `Surface water`, tranché le 2026-08-14 : le corpus est
  # bâti sur des chroniques de stations hydrométriques de cours d'eau, et
  # aucune fiche ne vise un plan d'eau. Chez eux `River` est un enfant de
  # `Surface water`, donc c'est un raffinement dans leur propre
  # hiérarchie, et c'est l'objet exact de leur `River discharge`, sous
  # lequel card se range.
  Q:
    property: theia:c_7742e5f0            # Discharge
    object:   theia:c_97bb7b91            # River
    cf: cfname:water_volume_transport_in_river_channel/
    same_as:  theia:c_dabd2d39            # 1 day mean river discharge
  Q_obs:
    property: theia:c_7742e5f0
    object:   theia:c_97bb7b91
    provenance: observed
  Q_sim:
    property: theia:c_7742e5f0
    object:   theia:c_97bb7b91
    provenance: simulated
  Q_lim:
    property: theia:c_7742e5f0
    object:   theia:c_97bb7b91
    parameter: true                       # colonne de seuil fournie
  R:
    property: theia:c_fb752be1            # Volume per area
    object:   theia:c_2b48133e            # Precipitation
    cf: cfname:precipitation_amount/
    same_as:  theia:c_ee31e37f            # 1 day cumulative precipitation amount
  R_obs:
    property: theia:c_fb752be1
    object:   theia:c_2b48133e
    provenance: observed
  R_sim:
    property: theia:c_fb752be1
    object:   theia:c_2b48133e
    provenance: simulated
  Rl:
    property: theia:c_fb752be1
    object:   theia:c_2b48133e
    constraint: liquid-phase              # défini plus bas
  Rs:
    property: theia:c_fb752be1
    object:   theia:c_2b48133e
    constraint: solid-phase
  T:
    property: theia:c_650214c2            # Temperature
    object:   theia:c_d57d0742            # Air
    cf: cfname:air_temperature/
    # `Mean air temperature` et non `Air temperature` : le second est leur
    # concept générique, qui est la cible de `broad_match` plus bas ; le
    # premier est la feuille, et `T` est bien une moyenne journalière.
    same_as:  theia:c_6496391a            # Mean air temperature
  T_obs:
    property: theia:c_650214c2
    object:   theia:c_d57d0742
    provenance: observed
  ETP:
    property: theia:c_fb752be1            # Volume per area
    object:   theia:c_b45bee9c            # Evapotranspiration
    cf: cfname:water_potential_evaporation_amount/
    same_as:  theia:c_6db0faac            # Potential evapotranspiration
  ET0_obs:
    property: theia:c_fb752be1
    object:   theia:c_b45bee9c
    provenance: observed
  S:
    # Surface du bassin, colonne constante. Aucun équivalent relevé chez
    # eux : laissé sans alignement plutôt que rattaché de force.
    property: null
    object:   null
    parameter: true

# ── Racines thématiques ───────────────────────────────────────────────
#
# La tête de l'arbre de card : une entrée par valeur de la facette
# `domain`. Ce qui est déclaré ici n'est PAS dérivable, et rien d'autre
# ne l'est : les libellés restent ceux de `topics.yaml`, l'appartenance
# des phénomènes à un domaine se MESURE sur le corpus.
#
# `broad_match` est le seul point de contact avec le thésaurus de
# Theia/OZCAR, et il tient en quatre lignes parce qu'il est posé au
# sommet : leur concept générique est plus large que TOUT ce que card
# calcule sur cette grandeur, donc la hiérarchie fait le reste. Mesuré
# le 2026-08-14 : leur branche débit s'arrête à `1 day mean river
# discharge`, qui est exactement le `Q` de card. Ils décrivent ce qu'on
# mesure, card décrit ce qu'on calcule dessus.
#
# `scope` dit ce que le rayon contient, et c'est un `skos:scopeNote`,
# la propriété SKOS faite pour ça. Le libellé de la facette
# (« débit », « flow ») nomme une GRANDEUR ; sous un concept externe il
# ne dirait pas qu'on est chez des indicateurs calculés. Deux propriétés
# distinctes plutôt qu'un second concept qui aurait la même extension.
topics:
  flow:
    broad_match: theia:c_9c959860         # River discharge
    en: Indicators computed from river discharge series.
    fr: Indicateurs calculés sur des chroniques de débit de rivière.
  precipitation:
    broad_match: theia:c_a9b2927c         # Precipitation amount
    en: Indicators computed from precipitation series.
    fr: Indicateurs calculés sur des chroniques de précipitations.
  temperature:
    broad_match: theia:c_6f0c66da         # Air temperature
    en: Indicators computed from air temperature series.
    fr: Indicateurs calculés sur des chroniques de température de l'air.
  evapotranspiration:
    broad_match: theia:c_6db0faac         # Potential evapotranspiration
    en: Indicators computed from evapotranspiration series.
    fr: Indicateurs calculés sur des chroniques d'évapotranspiration.

# ── Opérations statistiques ───────────────────────────────────────────
#
# Les clés sont les slugs de la facette `statistic` de topics.yaml, dont
# la clé `cf` nomme déjà le terme des conventions Climate and Forecast.
# Ici on ajoute l'URI résolvable de Theia, quand elle existe : cinq sur
# dix-huit, la statistique hydrologique n'ayant pas d'équivalent ailleurs.
statistic:
  mean:     {same_as: theia:c_00302ed7}   # Average
  median:   {same_as: theia:c_acc85532}
  minimum:  {same_as: theia:c_f91fc633}
  maximum:  {same_as: theia:c_e8336e2e}
  sum:      {same_as: theia:c_790e80ee}   # Accumulation
  # Les treize suivants sont propres à card : quantile,
  # threshold-exceedance, return-period, change, trend-slope,
  # trend-significance, ratio, bias, efficiency, elasticity,
  # correlation, slope, filter. Aucun alignement à déclarer, leurs
  # libellés vivent dans topics.yaml.

# ── Paramètres qui font une contrainte ────────────────────────────────
#
# Ce que le générateur doit lire dans les `func` des process, et ce
# qu'il doit ignorer. Un paramètre sémantique distingue une variable de
# ses frères (`VCN10` de `VCN3`) ; une option d'implémentation ne change
# pas la variable, elle change la façon de la calculer.
#
# Seuls les LITTÉRAUX comptent : `lim: 20` est une contrainte, `lim:
# upLim` est une référence à une colonne amont, et le loader distingue
# déjà les deux.
parameters:
  k:             {family: rolling-window, unit: {en: day, fr: jour}}
  p:             {family: exceedance-probability}
  return_period: {family: return-period, unit: {en: year, fr: an}}
  fraction:      {family: cumulative-fraction}
  fraction1:     {family: cumulative-fraction}
  fraction2:     {family: cumulative-fraction}
  # `invariable` : un SYMBOLE ne prend pas la marque du pluriel, un mot
  # si. Déclaré plutôt que deviné : « an » et « mm » font deux caractères
  # chacun, aucune règle de forme ne les sépare.
  lim:           {family: precipitation-threshold, literal_only: true,
                  unit: {en: mm, fr: mm, invariable: true}}

ignored_parameters:
  # Options d'implémentation : elles ne définissent pas la variable.
  - method          # Wallingford ou Lyne & Hollick, même débit de base
  - n               # nombre de points d'une courbe
  - what            # ce qu'apply_threshold renvoie, déjà dit par `aspect`
  - select
  - where
  - water_type      # déjà dit par `phenomenon`
  - func            # enveloppe over_period, la fonction est lue ailleurs
  - dates
  - level
  - thresh
  - periodicity
  - cyclical        # moyenne mobile refermée sur l'année : une façon de
                    #   calculer la moyenne, pas une autre grandeur
  - norm_spacing    # espacement de l'axe de probabilité d'une courbe
  - relative        # écart en % ou en unité : la différence est déjà dite
                    #   par `meta.unit`, et le choix découle de la nature
                    #   de la variable (`meta.global.relative`), il ne
                    #   distingue pas deux fiches frères
  # Références de colonnes, jamais des littéraux : ce sont des entrées.
  - X
  - Q
  - Q_for_BFI
  - threshold
  - period_start
  - period_end
  - ref_start
  - ref_end
  - horizon_start
  - horizon_end

# ── Notations officielles françaises ──────────────────────────────────
#
# DEUX registres, et c'est le fait à retenir avant de lire les tables. La
# France en a deux, d'âges différents, qui coexistent dans les mêmes
# pages : la grammaire du groupe de travail Statistiques du SCHAPI, que
# l'interface d'HydroPortail affiche, et la nomenclature nationale du
# Sandre, dont les codes viennent de l'ancienne Banque Hydro. `VCN10` et
# `Q10J-N` sont la même variable dans les deux registres.
#
# **Les trois descendent du même texte**, la nôtre comprise. Leur
# dictionnaire dit avoir été bâti, entre autres, sur « Normalisation des
# variables dans les modèles hydrologiques descriptifs », G. Oberlin,
# 1992, qui est la source de la grammaire de card (cf. NOMENCLATURE.md).
# Ce n'est donc pas un rapprochement de circonstance : c'est une
# divergence entre héritiers, et la rapprocher a du sens. C'est aussi
# pourquoi tout se relit à la main : deux grammaires aussi proches
# laissent passer une correspondance fausse sans que rien ne rougisse.
#
# UNE VALEUR PEUT ÊTRE UNE LISTE, et ce n'est pas une commodité : leur
# aide donne elle-même les équivalences (« Qm1J, raccourci en QmJ même
# plutôt QJ », « QmM-N, raccourci en QM-N », « Qi-X en général simplifié
# en Q-X »). Le PREMIER code est celui que l'interface affiche, les
# suivants sont des variantes attestées. Aucune n'est fabriquée ici.
#
# Ce qui figure, et RIEN d'autre : les correspondances que leur
# documentation ou leur interface donnent explicitement, et celles qui
# s'en déduisent par simple substitution d'un nombre (3 jours -> 10
# jours, retour 5 ans -> 2 ans). Une seule ligne fait exception et le
# dit.
#
# Un registre de plus ne demande aucun code : le générateur parcourt
# cette clé, et le type de littéral se déduit du nom du registre.
notations:

  # ── La grammaire du GT Stat, celle de l'interface ────────────────────
  #
  #   données de base   Grandeur + i|m + FiltreStatistique + FiltreTemporel
  #                     Q débit, H hauteur ; i instantané, m moyen ;
  #                     N minimum, X maximum ; J journalier, nJ n jours,
  #                     M mensuel, A annuel. La forme pleine est `Qm3J`,
  #                     le raccourci `Q3J` : les deux sont attestées, et
  #                     aucun de leurs documents ne dit laquelle fait foi.
  #   variables         DonnéesDeBase - Extracteur, période annuelle par
  #                     défaut
  #   valeurs caract.   Variable(PériodeDeRetour)
  #   fréquences        DonnéesDeBase en indice de la fréquence au NON
  #                     dépassement. La preuve n'est pas `QJ0,5`, qui est
  #                     symétrique et ne fixe rien : c'est le titre de
  #                     section de leur V6, plus `QJ0,0274` pour le débit
  #                     non dépassé 10 jours par an et `Freq[QJ <= QJn/12]
  #                     = n/12`. D'où `Q90`, dépassé 90 % du temps donc
  #                     non dépassé 10 %, qui s'écrit `QJ0,1`.
  hydroportail:
    source:
      en: SCHAPI/INRAE, statistical notations for HydroPortail
      fr: SCHAPI/INRAE, notations statistiques pour HydroPortail
      # L'aide en ligne, et non la V6 de mars 2022 : la V6 ne connaît pas
      # les marqueurs `i` et `m` que l'interface emploie, et c'est le
      # premier point de RETOURS_SCHAPI.md.
      url: https://hydro.eaufrance.fr/aide/donnees-et-noms-des-variables
      documents:
        - https://hydro.eaufrance.fr/uploads/Publications/NotationsStatistiquesV6_anonymisee.pdf
        - https://hydro.eaufrance.fr/uploads/Publications/ListeAnalysesStatistiques.pdf
    # Ce que card CONSOMME. Leur `QJ` est la chronique des débits moyens
    # journaliers, c'est-à-dire exactement l'entrée `Q` de card.
    inputs:
      Q: [QJ, QmJ, Qm1J]      # les trois écritures, données par leur aide
    # Ce que card PRODUIT. Les fenêtres saisonnières de card (`_summer`,
    # `_winter`) n'ont pas d'équivalent : leur extracteur est annuel, et
    # une fenêtre partielle n'est pas dans leur grammaire.
    variables:
      # Analyse de référence « toutes eaux » de toute station, dont la
      # fiche affiche les paramètres : année hydrologique du 01/09 au
      # 31/08, extracteur moyenne, grandeur QmnJ à 1 jour. C'est `QA`.
      # Leur V6 écrit aussi « QA ou Q-Moy » pour le débit moyen annuel,
      # mais `Q-Moy` a l'instantané pour donnée de base et `QA` ne dit
      # pas le pas de temps : seule celle-ci est sans ambiguïté.
      QA:      [QJ-annuel]
      # Seule ligne déduite d'une grille plutôt qu'attestée : `Q-N`,
      # `QM-N` et `Q3J-N` existent, la case journalière est vide.
      # Ne pas confondre avec leur `QJ(Min)`, qui est le minimum sur la
      # chronique entière et non la série des minimums annuels.
      QNA:     [QJ-N]
      VCN3:    [Q3J-N, Qm3J-N]     # donné tel quel, sigle répandu VCN3
      VCN10:   [Q10J-N, Qm10J-N]
      VCN30:   [Q30J-N, Qm30J-N]
      VCN10-5: [Q10J-N(5)]         # leur table donne Q3J-N(5) pour VCN3 (5)
      VCN30-2: [Q30J-N(2)]
      QMNA:    [QM-N, QmM-N]       # donné tel quel, sigle QMNA
      QMNA-5:  [QM-N(5)]           # donné tel quel, sigle QMNA5
      QJXA:    [QJ-X]              # « débit journalier maximal (annuel) »
      QJXA-10: [QJ-X(10)]          # donné tel quel, sigle QJX10
      VCX3:    [Q3J-X, Qm3J-X]     # donné tel quel, sigle VCX3
      VCX10:   [Q10J-X, Qm10J-X]
      # Guillemets obligatoires : la virgule est le séparateur d'une
      # liste YAML, et `[QJ0,9]` se lit sinon comme deux codes.
      Q10:     ["QJ0,9"]
      Q50:     ["QJ0,5"]           # donné tel quel, « débit journalier médian »
      Q90:     ["QJ0,1"]

  # ── Le registre national du Sandre ───────────────────────────────────
  #
  # Nomenclature 513, « Type de grandeur de l'observation élaborée
  # Hydro ». C'est de là que viennent les symboles dont card a hérité,
  # `VCN`, `VCX`, `QMNA`. Elle a une adresse, mais ses codes n'en ont
  # pas : `id.eaufrance.fr/nsa/513/QmJ` renvoie la nomenclature entière.
  # Un code ne peut donc pas être cité individuellement, et c'est
  # pourquoi il sort ici en `skos:notation` typée et non en alignement.
  #
  # N'y figure QUE ce qui n'est pas paramétré. Leur `VCN` désigne « le
  # débit minimal calculé sur n jours consécutifs », donc `VCN3`, `VCN10`
  # et `VCN30` à la fois : un code qui désigne trois concepts n'est pas
  # une notation, c'est une famille, et il n'a rien à faire ici.
  sandre_nsa513:
    source:
      en: Sandre, nomenclature 513, elaborated hydrometric quantity types
      fr: Sandre, nomenclature 513, type de grandeur de l'observation élaborée Hydro
      url: https://id.eaufrance.fr/nsa/513
    inputs:
      Q: QmJ                  # « Débit moyen journalier »
    variables:
      QA:      QmA            # « Débit moyen annuel »
      mean-QA: Module         # « Débit moyen inter-annuel », valeur non datée
      QMNA:    QMNA           # « Débit moyen mensuel minimal par année »

# ── Familles de contrainte définies par card ──────────────────────────
#
# Aucune n'existe chez Theia : leur branche `Constraint` porte des
# contraintes physiques (rayonnement, phase, sédiment), jamais une
# fenêtre ni un paramètre statistique. Ce sont donc des concepts propres,
# et c'est l'extension qu'on peut leur proposer.
constraint_families:
  rolling-window:
    en: rolling window
    fr: fenêtre glissante
  exceedance-probability:
    en: exceedance probability
    fr: probabilité de dépassement
  return-period:
    en: return period
    fr: période de retour
  cumulative-fraction:
    en: cumulative fraction
    fr: fraction cumulée
  precipitation-threshold:
    en: precipitation threshold
    fr: seuil de précipitation
  sampling-window:
    en: sampling window
    fr: fenêtre d'échantillonnage
  phase:
    en: phase
    fr: phase

# Contraintes nommées, hors paramètre numérique.
constraints:
  liquid-phase:
    en: liquid phase
    fr: phase liquide
    family: phase
  solid-phase:
    en: solid phase
    fr: phase solide
    family: phase
