id: mean-TSA_season
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: [mean-TSA_DJF, mean-TSA_MAM, mean-TSA_JJA, mean-TSA_SON]
    unit: "°C"
    name:
      - "Inter-annual mean of winter mean temperatures (months of December, January and February)"
      - "Inter-annual mean of spring mean temperatures (months of March, April and May)"
      - "Inter-annual mean of summer mean temperatures (months of June, July and August)"
      - "Inter-annual mean of fall mean temperatures (months of September, October and November)"
    description:
      - ""
      - ""
      - ""
      - ""
    method:
      P1:
        TSA_DJF: seasonal annual aggregation [12-01, 02-28(29)] - average
        TSA_MAM: seasonal annual aggregation [03-01, 05-31] - average
        TSA_JJA: seasonal annual aggregation [06-01, 08-31] - average
        TSA_SON: seasonal annual aggregation [09-01, 11-30] - average
      P2:
        mean-TSA_DJF: no temporal aggregation - inter-annual mean
        mean-TSA_MAM: no temporal aggregation - inter-annual mean
        mean-TSA_JJA: no temporal aggregation - inter-annual mean
        mean-TSA_SON: no temporal aggregation - inter-annual mean
    sampling_period:
      - ["12-01", "02-28(29)"]
      - ["03-01", "05-31"]
      - ["06-01", "08-31"]
      - ["09-01", "11-30"]
    classification:
      domain: temperature
      phenomenon: mean temperatures
      aspect: magnitude
      season: by season
      output: scalar

  fr:
    variable: [moyenne-TSA_DJF, moyenne-TSA_MAM, moyenne-TSA_JJA, moyenne-TSA_SON]
    unit: "°C"
    name:
      - Moyenne inter-annuelle des températures moyennes d'hiver
      - Moyenne inter-annuelle des températures moyennes de printemps
      - Moyenne inter-annuelle des températures moyennes d'été
      - Moyenne inter-annuelle des températures moyennes d'automne
    description:
      - "Mois de décembre, janvier et février"
      - "Mois de mars, avril et mai"
      - "Mois de juin, juillet et août"
      - "Mois de septembre, octobre et novembre"
    method:
      P1:
        TSA_DJF: agrégation annuelle saisonnalisée [01-12, 28(29)-02] - moyenne
        TSA_MAM: agrégation annuelle saisonnalisée [01-03, 31-05] - moyenne
        TSA_JJA: agrégation annuelle saisonnalisée [01-06, 31-08] - moyenne
        TSA_SON: agrégation annuelle saisonnalisée [01-09, 30-11] - moyenne
      P2:
        mean-TSA_DJF: aucune agrégation temporelle - moyenne inter-annuelle
        mean-TSA_MAM: aucune agrégation temporelle - moyenne inter-annuelle
        mean-TSA_JJA: aucune agrégation temporelle - moyenne inter-annuelle
        mean-TSA_SON: aucune agrégation temporelle - moyenne inter-annuelle
    sampling_period:
      - ["01-12", "28(29)-02"]
      - ["01-03", "31-05"]
      - ["01-06", "31-08"]
      - ["01-09", "30-11"]
    classification:
      domain: température
      phenomenon: températures moyennes
      aspect: intensité
      season: par saison
      output: scalaire

  global:
    input_vars: T
    relative: false
    palette: ["#053061", "#2166AC", "#4393C3", "#92C5DE", "#D1E5F0",
              "#FDDBC7", "#F4A582", "#D6604D", "#B2182B", "#67001F"]

process:
  P1:
    func:
      TSA: [nanmean, "T"]
    time_step: year-season
    seasons: [DJF, MAM, JJA, SON]
    max_na_pct: 3
    max_na_years: 10
    compress: true
  P2:
    func:
      mean-TSA_DJF: [nanmean, "TSA_DJF"]
      mean-TSA_MAM: [nanmean, "TSA_MAM"]
      mean-TSA_JJA: [nanmean, "TSA_JJA"]
      mean-TSA_SON: [nanmean, "TSA_SON"]
    time_step: none
