id: mean-TA
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: mean-TA
    unit: "°C"
    name: Inter-annual mean of the annual mean temperature
    description: ""
    method:
      P1:
        TA: annual aggregation [09-01, 08-31] - mean
      P2:
        mean-TA: no temporal aggregation - inter-annual mean
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: temperature
      phenomenon: mean temperatures
      aspect: magnitude
      statistic: mean
      season: annual
      output: scalar

  fr:
    variable: moyenne-TA
    unit: "°C"
    name: Moyenne inter-annuelle de la température moyenne annuelle
    description: ""
    method:
      P1:
        TA: agrégation annuelle [01-09, 31-08] - moyenne
      P2:
        mean-TA: aucune agrégation temporelle - moyenne inter-annuelle
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: température
      phenomenon: températures moyennes
      aspect: intensité
      statistic: moyenne
      season: annuelle
      output: scalaire

  global:
    input_vars: T
    is_date: false
    relative: false
    palette: ["#053061", "#2166AC", "#4393C3", "#92C5DE", "#D1E5F0",
              "#FDDBC7", "#F4A582", "#D6604D", "#B2182B", "#67001F"]

process:
  P1:
    func:
      TA: [nanmean, "T"]
    time_step: year
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      mean-TA: [nanmean, "TA"]
    time_step: none
