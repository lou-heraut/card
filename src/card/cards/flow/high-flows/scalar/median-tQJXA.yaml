id: median-tQJXA
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-tQJXA
    unit: yearday
    name: Inter-annual median of the dates of the annual maximum daily discharge
    description: ""
    method:
      P1:
        tQJXA: annual aggregation [month of minimum monthly flows] - date of the maximum
      P2:
        median-tQJXA: no temporal aggregation - inter-annual median
    sampling_period: Month of minimum monthly flows
    classification:
      domain: flow
      phenomenon: high flows
      aspect: timing
      season: annual
      output: scalar

  fr:
    variable: mediane-tQJXA
    unit: "jour de l'année"
    name: Médiane inter-annuelle des dates du débit journalier maximal annuel
    description: ""
    method:
      P1:
        tQJXA: agrégation annuelle [mois du minimum des débits mensuels] - date du maximum
      P2:
        median-tQJXA: aucune agrégation temporelle - médiane inter-annuelle
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: débit
      phenomenon: hautes eaux
      aspect: saisonnalité
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "09-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      tQJXA: [nanargmax, "Q", true]
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3
    max_na_years: 10

  P2:
    func:
      median-tQJXA: [circular_median, "tQJXA", {periodicity: 365.25}]
    time_step: none
