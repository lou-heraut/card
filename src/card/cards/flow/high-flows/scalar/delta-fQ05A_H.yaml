id: delta-fQ05A_H
version: "1.5"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-21"

meta:
  en:
    variable: delta-fQ05A
    unit: without unit
    name: "Average change of the annual frequency of exceeding Q05 between the {suffix.name} horizon and historical period"
    description: >-
      Annual frequency of exceeding Q > Q05, where Q05 is the flow exceeded
      5 % of the time, extracted from the ranked flow curve
    method:
      P1:
        lowLim: no temporal aggregation - quantile at the 5 % exceedance probability, taken as the threshold (lowLim)
      P2:
        fQ05A: annual aggregation [month of minimum monthly flows] - ratio of the number of days with flow exceeding lowLim to the number of days in the year
      P3:
        delta-fQ05A: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
    suffix_default:
      name: target
    sampling_period: Month of minimum monthly flows
    classification:
      domain: flow
      phenomenon: high flows
      aspect: frequency
      statistic: change
      season: annual
      output: scalar

  fr:
    variable: delta-fQ05A
    unit: sans unité
    name: "Changement moyen de la fréquence annuelle de dépassement du Q05 entre l'horizon {suffix.name} et la période historique"
    description: >-
      Fréquence annuelle de dépassement de Q > Q05, Q05 est le débit dépassé
      5 % du temps, extrait de la courbe des débits classés
    method:
      P1:
        lowLim: aucune agrégation temporelle - quantile à la probabilité de dépassement de 5 %, pris comme seuil (lowLim)
      P2:
        fQ05A: agrégation annuelle [mois du minimum des débits mensuels] - rapport du nombre de jours où le débit dépasse lowLim par le nombre de jours dans l'année
      P3:
        delta-fQ05A: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
    suffix_default:
      name: cible
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: débit
      phenomenon: hautes eaux
      aspect: fréquence
      statistic: écart
      season: annuelle
      output: scalaire

  global:
    input_vars: "Q, ref_start, ref_end, horizon_start, horizon_end"
    preferred_sampling_period: "09-01"
    is_date: false
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      lowLim: [exceedance_quantile, "Q", {p: 0.05}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      fQ05A: [exceedance_frequency, "Q", {threshold: lowLim}]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3

  P3:
    func:
      delta-fQ05A: [delta, "fQ05A", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
    time_step: none
