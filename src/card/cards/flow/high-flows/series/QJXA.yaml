id: QJXA
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-28"

meta:
  en:
    variable: QJXA
    unit: "m^{3}.s^{-1}"
    name: "Annual maximum daily flow"
    description: ""
    method:
      P1:
        QJXA: annual aggregation [month of minimum monthly flows] - maximum
    sampling_period: Month of minimum monthly flows
    classification:
      domain: flow
      phenomenon: high flows
      aspect: magnitude
      statistic: maximum
      season: annual
      output: series

  fr:
    variable: QJXA
    unit: "m^{3}.s^{-1}"
    name: "Débit journalier maximal annuel"
    description: ""
    method:
      P1:
        QJXA: agrégation annuelle [mois du minimum des débits mensuels] - maximum
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: débit
      phenomenon: hautes eaux
      aspect: intensité
      statistic: maximum
      season: annuelle
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "09-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      QJXA: [nanmax, "Q"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3
    max_na_years: 10
