id: fQ10A
version: "1.4"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-28"

meta:
  en:
    variable: fQ10A
    unit: without unit
    name: "Annual frequency of exceeding Q10"
    description: >-
      Annual frequency of exceeding Q > Q10, where Q10 is the flow exceeded
      10 % of the time, extracted from the ranked flow curve
    method:
      P1:
        lowLim: no temporal aggregation - quantile at the 10 % exceedance probability, taken as the threshold (lowLim)
      P2:
        fQ10A: annual aggregation [month of minimum monthly flows] - ratio of the number of days with flow exceeding lowLim to the number of days in the year
    sampling_period: Month of minimum monthly flows
    classification:
      domain: flow
      phenomenon: high flows
      aspect: frequency
      statistic: threshold exceedance
      season: annual
      output: series

  fr:
    variable: fQ10A
    unit: sans unité
    name: "Fréquence annuelle de dépassement du Q10"
    description: >-
      Fréquence annuelle de dépassement de Q > Q10, Q10 est le débit dépassé
      10 % du temps, extrait de la courbe des débits classés
    method:
      P1:
        lowLim: aucune agrégation temporelle - quantile à la probabilité de dépassement de 10 %, pris comme seuil (lowLim)
      P2:
        fQ10A: agrégation annuelle [mois du minimum des débits mensuels] - rapport du nombre de jours où le débit dépasse lowLim par le nombre de jours dans l'année
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: débit
      phenomenon: hautes eaux
      aspect: fréquence
      statistic: dépassement de seuil
      season: annuelle
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "09-01"
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      lowLim: [exceedance_quantile, "Q", {p: 0.1}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      fQ10A: [exceedance_frequency, "Q", {threshold: lowLim}]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3
