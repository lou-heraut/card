id: allLF_summer
version: "1.3"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-30"

meta:
  en:
    variable: [startLF_summer, centerLF_summer, endLF_summer, dtLF_summer, vLF_summer]
    unit: [yearday, yearday, yearday, day, "hm^{3}"]
    name:
      - Start of summer low flows
      - Center of summer low flows
      - End of summer low flows
      - Duration of summer low flows
      - Volume deficit of summer low flows
    description:
      - "In summer, date of the first 10-day mean flow value below the threshold set at the maximum of VCN10 (May to November)"
      - "In summer, date of the minimal 10-day mean flow value below the threshold set at the maximum of VCN10 (May to November)"
      - "In summer, date of the last 10-day mean flow value below the threshold set at the maximum of VCN10 (May to November)"
      - "In summer, duration of the longest continuous sequence with 10-day mean flows below the threshold set at the maximum of VCN10 (May to November)"
      - "In summer, sum of the differences between the 10-day mean and the maximum of VCN10, over the longest sequence below this threshold (May to November)"
    method:
      P1:
        VC10_summer: no temporal aggregation - 10-day centered moving average (VC10_summer)
      P2:
        VCN10_summer: annual aggregation [05-01, 11-30] - minimum of VC10_summer (VCN10_summer)
      P3:
        upLim: no temporal aggregation - the maximum of VCN10_summer is taken as the threshold (upLim)
      P4:
        startLF_summer: annual aggregation [05-01, 11-30] - date of the first day of the longest period below upLim
        centerLF_summer: annual aggregation [05-01, 11-30] - date of the minimum of VC10_summer over the longest period below upLim
        endLF_summer: annual aggregation [05-01, 11-30] - date of the last day of the longest period below upLim
        dtLF_summer: annual aggregation [05-01, 11-30] - number of days in the longest period below upLim
        vLF_summer: annual aggregation [05-01, 11-30] - sum of volumes discharged each day in the longest period below upLim
    sampling_period: ["05-01", "11-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: [timing, timing, timing, duration, magnitude]
      season: summer
      output: series

  fr:
    variable: [debutBE_été, centreBE_été, finBE_été, dtBE_été, vBE_été]
    unit: ["jour de l'année", "jour de l'année", "jour de l'année", jour, "hm^{3}"]
    name:
      - Début des basses eaux estivales
      - Centre des basses eaux estivales
      - Fin des basses eaux estivales
      - Durée des basses eaux estivales
      - Volume de déficit des basses eaux estivales
    description:
      - "En été, date de la première valeur de débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
      - "En été, date de la valeur minimale des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
      - "En été, date de la dernière valeur de débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
      - "En été, durée de la plus longue séquence continue avec des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
      - "En été, somme des écarts entre la moyenne sur 10 jours et le maximum des VCN10, sur la séquence la plus longue sous ce seuil (mois de mai à novembre)"
    method:
      P1:
        VC10_summer: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10_summer)
      P2:
        VCN10_summer: agrégation annuelle [01-05, 30-11] - minimum de VC10_summer (VCN10_summer)
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10_summer est pris comme seuil (upLim)
      P4:
        startLF_summer: agrégation annuelle [01-05, 30-11] - date du premier jour de la plus longue période sous upLim
        centerLF_summer: agrégation annuelle [01-05, 30-11] - date du minimum de VC10_summer sur la plus longue période sous upLim
        endLF_summer: agrégation annuelle [01-05, 30-11] - date du dernier jour de la plus longue période sous upLim
        dtLF_summer: agrégation annuelle [01-05, 30-11] - nombre de jours de la plus longue période sous upLim
        vLF_summer: agrégation annuelle [01-05, 30-11] - somme des volumes écoulés chaque jour de la plus longue période sous upLim
    sampling_period: ["01-05", "30-11"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect:
        - saisonnalité
        - saisonnalité
        - saisonnalité
        - durée
        - intensité
      season: estivale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: [true, true, true, false, false]
    relative: [false, false, false, false, true]
    palette:
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5", "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]
      - ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5", "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10_summer: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_summer: [nanmin, "VC10_summer"]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_summer"]
    time_step: none
    keep: all

  P4:
    func:
      startLF_summer:  [apply_threshold, "VC10_summer", {lim: upLim, where: "<=", what: first, select: longest}, true]
      centerLF_summer: [apply_threshold, "VC10_summer", {lim: upLim, where: "<=", what: nanargmin, select: longest}, true]
      endLF_summer:    [apply_threshold, "VC10_summer", {lim: upLim, where: "<=", what: last, select: longest}, true]
      dtLF_summer:     [apply_threshold, "VC10_summer", {lim: upLim, where: "<=", what: length, select: longest}]
      vLF_summer:      [deficit_volume, "VC10_summer", {threshold: upLim}]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
