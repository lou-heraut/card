id: tVCN10_winter
version: "1.0"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-30"

meta:
  en:
    variable: tVCN10_winter
    unit: yearday
    name: Date of the winter minimum of 10-day mean flows
    description: Months from November to April
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average
      P2:
        tVCN10_winter: annual aggregation [11-01, 04-30] - date of the minimum
    sampling_period: ["11-01", "04-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: timing
      season: winter
      output: series

  fr:
    variable: tVCN10_hiver
    unit: jour de l'année
    name: Date du minimum hivernal des débits moyens sur 10 jours
    description: Mois de novembre à avril
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours
      P2:
        tVCN10_winter: agrégation annuelle [01-11, 30-04] - date du minimum
    sampling_period: ["01-11", "30-04"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: saisonnalité
      season: hivernale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      tVCN10_winter: [nanargmin, "VC10", true]
    time_step: year
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
    max_na_years: 10
