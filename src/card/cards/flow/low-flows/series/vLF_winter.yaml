id: vLF_winter
version: "1.6"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-15"

meta:
  en:
    variable: vLF_winter
    unit: "hm^{3}"
    name: Deficit volume of winter low flows
    description: "In winter, sum of the differences between the 10-day mean and the maximum of VCN10, over the longest sequence below this threshold (November to April)"
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10_winter: annual aggregation [11-01, 04-30] - minimum of VC10 (VCN10_winter)
      P3:
        upLim: no temporal aggregation - maximum of VCN10_winter, taken as the threshold (upLim)
      P4:
        vLF_winter: annual aggregation [11-01, 04-30] - sum of volumes discharged each day in the longest period below upLim
    sampling_period: ["11-01", "04-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      statistic: sum
      season: winter
      output: series

  fr:
    variable: vBE_hiver
    unit: "hm^{3}"
    name: Volume de déficit des basses eaux hivernales
    description: "En hiver, somme des écarts entre la moyenne sur 10 jours et le maximum des VCN10, sur la séquence la plus longue sous ce seuil (mois de novembre à avril)"
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10_winter: agrégation annuelle [01-11, 30-04] - minimum de VC10 (VCN10_winter)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10_winter, pris comme seuil (upLim)
      P4:
        vLF_winter: agrégation annuelle [01-11, 30-04] - somme des volumes écoulés chaque jour de la plus longue période sous upLim
    sampling_period: ["01-11", "30-04"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      statistic: somme
      season: hivernale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    relative: true
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_winter: [nanmin, "VC10"]
    time_step: year
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_winter"]
    time_step: none
    keep: all

  P4:
    func:
      vLF_winter: [deficit_volume, "VC10", {threshold: upLim}]
    time_step: year
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
