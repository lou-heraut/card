id: VCN30_winter
version: "1.0"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-30"

meta:
  en:
    variable: VCN30_winter
    unit: "m^{3}.s^{-1}"
    name: Winter minimum of 30-day mean daily discharge
    description: ""
    method:
      P1:
        VC30: no temporal aggregation - 30-day centered moving average
      P2:
        VCN30_winter: annual aggregation [11-01, 04-30] - minimum
    sampling_period: ["11-01", "04-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: winter
      output: series

  fr:
    variable: VCN30_hiver
    unit: "m^{3}.s^{-1}"
    name: Minimum hivernal de la moyenne sur 30 jours du débit journalier
    description: ""
    method:
      P1:
        VC30: aucune agrégation temporelle - moyenne mobile centrée sur 30 jours
      P2:
        VCN30_winter: agrégation annuelle [01-11, 30-04] - minimum
    sampling_period: ["01-11", "30-04"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: hivernale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      VC30: [rollmean_center, "Q", {k: 30}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      VCN30_winter: [nanmin, "VC30"]
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
