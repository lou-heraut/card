id: centerLF_summer
version: "1.4"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-15"

meta:
  en:
    variable: centerLF_summer
    unit: yearday
    name: Center of summer low flows
    description: "In summer, date of the minimal 10-day mean flow value below the threshold set at the maximum of VCN10 (May to November)"
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10_summer: annual aggregation [05-01, 11-30] - minimum of VC10 (VCN10_summer)
      P3:
        upLim: no temporal aggregation - maximum of VCN10_summer, taken as the threshold (upLim)
      P4:
        centerLF_summer: annual aggregation [05-01, 11-30] - date of the minimum of VC10 over the longest period below upLim
    sampling_period: ["05-01", "11-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: timing
      statistic: threshold exceedance
      season: summer
      output: series

  fr:
    variable: centreBE_été
    unit: "jour de l'année"
    name: Centre des basses eaux estivales
    description: "En été, date de la valeur minimale des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10_summer: agrégation annuelle [01-05, 30-11] - minimum de VC10 (VCN10_summer)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10_summer, pris comme seuil (upLim)
      P4:
        centerLF_summer: agrégation annuelle [01-05, 30-11] - date du minimum de VC10 sur la plus longue période sous upLim
    sampling_period: ["01-05", "30-11"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: saisonnalité
      statistic: dépassement de seuil
      season: estivale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_summer: [nanmin, "VC10"]
    time_step: year
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_summer"]
    time_step: none
    keep: all

  P4:
    func:
      centerLF_summer: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: nanargmin, select: longest}, true]
    time_step: year
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
