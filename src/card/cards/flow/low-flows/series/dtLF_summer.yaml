id: dtLF_summer
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-15"

meta:
  en:
    variable: dtLF_summer
    unit: day
    name: Duration of summer low flows
    description: "In summer, duration of the longest continuous sequence with 10-day mean flows below the threshold set at the maximum of VCN10 (May to November)"
    method:
      P1:
        VC10_summer: no temporal aggregation - 10-day centered moving average
      P2:
        VCN10_summer: annual aggregation [05-01, 11-30] - minimum
      P3:
        upLim: no temporal aggregation - the maximum of VCN10_summer is taken as the threshold
      P4:
        dtLF_summer: annual aggregation [05-01, 11-30] - number of days in the longest period below upLim
    sampling_period: ["05-01", "11-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: duration
      season: summer
      output: series

  fr:
    variable: dtBE_été
    unit: jour
    name: Durée des basses eaux estivales
    description: "En été, durée de la plus longue séquence continue avec des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de mai à novembre)"
    method:
      P1:
        VC10_summer: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours
      P2:
        VCN10_summer: agrégation annuelle [01-05, 30-11] - minimum
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10_summer est pris comme seuil
      P4:
        dtLF_summer: agrégation annuelle [01-05, 30-11] - nombre de jours de la plus longue période sous upLim
    sampling_period: ["01-05", "30-11"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: durée
      season: estivale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    relative: false
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10_summer: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_summer: [nanmin, "VC10_summer"]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_summer"]
    time_step: none
    keep: all

  P4:
    func:
      dtLF_summer: [apply_threshold, "VC10_summer", {lim: upLim, where: "<=", what: length, select: longest}]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
