id: centerLF_winter
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-15"

meta:
  en:
    variable: centerLF_winter
    unit: yearday
    name: Center of winter low flows
    description: "In winter, date of the minimal 10-day mean flow value below the threshold set at the maximum of VCN10 (November to April)"
    method:
      P1:
        VC10_winter: no temporal aggregation - 10-day centered moving average (VC10_winter)
      P2:
        VCN10_winter: annual aggregation [11-01, 04-30] - minimum of VC10_winter (VCN10_winter)
      P3:
        upLim: no temporal aggregation - the maximum of VCN10_winter is taken as the threshold (upLim)
      P4:
        centerLF_winter: annual aggregation [11-01, 04-30] - date of the minimum of VC10_winter over the longest period below upLim
    sampling_period: ["11-01", "04-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: timing
      season: winter
      output: series

  fr:
    variable: centreBE_hiver
    unit: "jour de l'année"
    name: Centre des basses eaux hivernales
    description: "En hiver, date de la valeur minimale des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de novembre à avril)"
    method:
      P1:
        VC10_winter: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10_winter)
      P2:
        VCN10_winter: agrégation annuelle [01-11, 30-04] - minimum de VC10_winter (VCN10_winter)
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10_winter est pris comme seuil (upLim)
      P4:
        centerLF_winter: agrégation annuelle [01-11, 30-04] - date du minimum de VC10_winter sur la plus longue période sous upLim
    sampling_period: ["01-11", "30-04"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: saisonnalité
      season: hivernale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      VC10_winter: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_winter: [nanmin, "VC10_winter"]
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_winter"]
    time_step: none
    keep: all

  P4:
    func:
      centerLF_winter: [apply_threshold, "VC10_winter", {lim: upLim, where: "<=", what: nanargmin, select: longest}, true]
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
