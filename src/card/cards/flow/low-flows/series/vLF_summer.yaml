id: vLF_summer
version: "1.3"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-15"

meta:
  en:
    variable: vLF_summer
    unit: "hm^{3}"
    name: Volume deficit of summer low flows
    description: "In summer, sum of the differences between the 10-day mean and the maximum of VCN10, over the longest sequence below this threshold (May to November)"
    method:
      P1:
        VC10_summer: no temporal aggregation - 10-day centered moving average (VC10_summer)
      P2:
        VCN10_summer: annual aggregation [05-01, 11-30] - minimum of VC10_summer (VCN10_summer)
      P3:
        upLim: no temporal aggregation - the maximum of VCN10_summer is taken as the threshold (upLim)
      P4:
        vLF_summer: annual aggregation [05-01, 11-30] - sum of volumes discharged each day in the longest period below upLim
    sampling_period: ["05-01", "11-30"]
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: summer
      output: series

  fr:
    variable: vBE_été
    unit: "hm^{3}"
    name: Volume de déficit des basses eaux estivales
    description: "En été, somme des écarts entre la moyenne sur 10 jours et le maximum des VCN10, sur la séquence la plus longue sous ce seuil (mois de mai à novembre)"
    method:
      P1:
        VC10_summer: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10_summer)
      P2:
        VCN10_summer: agrégation annuelle [01-05, 30-11] - minimum de VC10_summer (VCN10_summer)
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10_summer est pris comme seuil (upLim)
      P4:
        vLF_summer: agrégation annuelle [01-05, 30-11] - somme des volumes écoulés chaque jour de la plus longue période sous upLim
    sampling_period: ["01-05", "30-11"]
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: estivale
      output: série

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10_summer: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_summer: [nanmin, "VC10_summer"]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_summer"]
    time_step: none
    keep: all

  P4:
    func:
      vLF_summer: [deficit_volume, "VC10_summer", {threshold: upLim}]
    sampling_period: ["05-01", "11-30"]
    max_na_pct: 3
