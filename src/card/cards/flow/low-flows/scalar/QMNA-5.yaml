id: QMNA-5
version: "1.3"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: QMNA-5
    unit: "m^{3}.s^{-1}"
    name: Annual minimum of monthly flows with a return period of 5 years
    description: ""
    method:
      P1:
        QMA: monthly aggregation for each year - mean
      P2:
        QMNA: annual aggregation [month of maximum monthly flows] - minimum
      P3:
        QMNA-5: no temporal aggregation - calculation of the 5-year return period flow with the log-normal distribution
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: by month
      output: scalar

  fr:
    variable: QMNA-5
    unit: "m^{3}.s^{-1}"
    name: Minimum annuel des débits mensuels de période de retour 5 ans
    description: ""
    method:
      P1:
        QMA: agrégation mensuelle par année - moyenne
      P2:
        QMNA: agrégation annuelle [mois du maximum des débits mensuels] - minimum
      P3:
        QMNA-5: aucune agrégation temporelle - calcul du débit de période de retour 5 ans avec la loi log-normale
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: par mois
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      QMA: [nanmean, "Q"]
    time_step: year-month
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P2:
    func:
      QMNA: [nanmin, "QMA"]
    sampling_period:
      type: adaptive
      func: [nanmax, "QMA"]
    max_na_pct: 3

  P3:
    func:
      QMNA-5: [return_level, "QMNA", {return_period: 5, water_type: "low"}]
    time_step: none
