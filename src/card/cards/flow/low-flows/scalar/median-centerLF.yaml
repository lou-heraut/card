id: median-centerLF
version: "1.5"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-centerLF
    unit: yearday
    name: Inter-annual median of the center of low flows
    description: Median of the dates of the minimal 10-day mean flow value below the threshold set at the maximum of VCN10
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10: annual aggregation [month of maximum monthly flows] - minimum of VC10 (VCN10)
      P3:
        upLim: no temporal aggregation - maximum of VCN10, taken as the threshold (upLim)
      P4:
        centerLF: annual aggregation [month of maximum monthly flows] - date of the minimum of VC10 over the longest period below upLim
      P5:
        median-centerLF: no temporal aggregation - inter-annual median
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: timing
      statistic: median
      season: annual
      output: scalar

  fr:
    variable: mediane-centreBE
    unit: "jour de l'année"
    name: Médiane inter-annuelle du centre des basses eaux
    description: Médiane des dates de la valeur minimale des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10: agrégation annuelle [mois du maximum des débits mensuels] - minimum de VC10 (VCN10)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10, pris comme seuil (upLim)
      P4:
        centerLF: agrégation annuelle [mois du maximum des débits mensuels] - date du minimum de VC10 sur la plus longue période sous upLim
      P5:
        median-centerLF: aucune agrégation temporelle - médiane inter-annuelle
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: saisonnalité
      statistic: médiane
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10"]
    time_step: none
    keep: all

  P4:
    func:
      centerLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: nanargmin, select: longest}, true]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P5:
    func:
      median-centerLF: [circular_median, "centerLF", {periodicity: 365.25}]
    time_step: none
