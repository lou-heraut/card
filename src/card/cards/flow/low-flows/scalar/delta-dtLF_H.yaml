id: delta-dtLF_H
version: "1.3"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-21"

meta:
  en:
    variable: delta-dtLF
    unit: day
    name: Average change of duration of low flows between the {suffix.name} horizon and historical period
    description: Duration of the longest continuous sequence with 10-day mean flows below the threshold set at the maximum of VCN10
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average
      P2:
        VCN10: annual aggregation [Month of maximum monthly flows] - minimum
      P3:
        upLim: no temporal aggregation - the maximum of VCN10 is taken as the threshold
      P4:
        dtLF: annual aggregation [Month of maximum monthly flows] - number of days in the longest period below upLim
      P5:
        delta-dtLF: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
    suffix_default:
      name: target
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: duration
      season: annual
      output: scalar

  fr:
    variable: delta-dtBE
    unit: jour
    name: Changement moyen de la durée des basses eaux entre l'horizon {suffix.name} et la période historique
    description: Durée de la plus longue séquence continue avec des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours
      P2:
        VCN10: agrégation annuelle [Mois du maximum des débits mensuels] - minimum
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10 est pris comme seuil
      P4:
        dtLF: agrégation annuelle [Mois du maximum des débits mensuels] - nombre de jours de la plus longue période sous upLim
      P5:
        delta-dtLF: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
    suffix_default:
      name: cible
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: durée
      season: annuelle
      output: scalaire

  global:
    input_vars: "Q, ref_start, ref_end, horizon_start, horizon_end"
    preferred_sampling_period: "01-01"
    relative: false
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10"]
    time_step: none
    keep: all

  P4:
    func:
      dtLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: length, select: longest}]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P5:
    func:
      delta-dtLF: [delta, "dtLF", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
    time_step: none
