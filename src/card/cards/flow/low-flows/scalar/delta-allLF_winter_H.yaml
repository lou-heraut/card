id: delta-allLF_winter_H
version: "3.0"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-21"

meta:
  en:
    variable:
    - delta-startLF_winter
    - delta-centerLF_winter
    - delta-endLF_winter
    - delta-dtLF_winter
    - delta-vLF_winter
    unit:
    - day
    - day
    - day
    - day
    - '%'
    name:
    - Average change of the start of winter low flows between the {suffix.name} horizon and historical period
    - Average change of the center of winter low flows between the {suffix.name} horizon and historical period
    - Average change of the end of winter low flows between the {suffix.name} horizon and historical period
    - Average change of duration of winter low flows between the {suffix.name} horizon and historical period
    - Average change of the deficit volume of winter low flows between the {suffix.name} horizon and historical period
    description:
    - In winter, date of the first 10-day mean flow value below the threshold set at the maximum of VCN10 (November to April)
    - In winter, date of the minimal 10-day mean flow value below the threshold set at the maximum of VCN10 (November to April)
    - In winter, date of the last 10-day mean flow value below the threshold set at the maximum of VCN10 (November to April)
    - In winter, duration of the longest continuous sequence with 10-day mean flows below the threshold set at the maximum of VCN10 (November to April)
    - In winter, sum of the differences between the 10-day mean and the maximum of VCN10, over the longest sequence below this threshold (November to April)
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10_winter: annual aggregation [11-01, 04-30] - minimum of VC10 (VCN10_winter)
      P3:
        upLim: no temporal aggregation - maximum of VCN10_winter, taken as the threshold (upLim)
      P4:
        startLF_winter: annual aggregation [11-01, 04-30] - date of the first day of the longest period below upLim
        centerLF_winter: annual aggregation [11-01, 04-30] - date of the minimum of VC10 over the longest period below upLim
        endLF_winter: annual aggregation [11-01, 04-30] - date of the last day of the longest period below upLim
        dtLF_winter: annual aggregation [11-01, 04-30] - number of days in the longest period below upLim
        vLF_winter: annual aggregation [11-01, 04-30] - sum of volumes discharged each day in the longest period below upLim
      P5:
        delta-startLF_winter: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
        delta-centerLF_winter: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
        delta-endLF_winter: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
        delta-dtLF_winter: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
        delta-vLF_winter: no temporal aggregation - calculation of the average change between the historical period and the {suffix.name} horizon
    sampling_period:
    - 11-01
    - 04-30
    classification:
      domain: flow
      phenomenon: low flows
      aspect:
      - timing
      - timing
      - timing
      - duration
      - magnitude
      statistic: [change, change, change, change, change]
      season: winter
      output: scalar
    suffix_default:
      name: target

  fr:
    variable:
    - delta-debutBE_hiver
    - delta-centreBE_hiver
    - delta-finBE_hiver
    - delta-dtBE_hiver
    - delta-vBE_hiver
    unit:
    - jour
    - jour
    - jour
    - jour
    - '%'
    name:
    - Changement moyen du début des basses eaux hivernales entre l'horizon {suffix.name} et la période historique
    - Changement moyen du centre des basses eaux hivernales entre l'horizon {suffix.name} et la période historique
    - Changement moyen de la fin des basses eaux hivernales entre l'horizon {suffix.name} et la période historique
    - Changement moyen de la durée des basses eaux hivernales entre l'horizon {suffix.name} et la période historique
    - Changement moyen du volume de déficit des basses eaux hivernales entre l'horizon {suffix.name} et la période historique
    description:
    - En hiver, date de la première valeur de débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de novembre à avril)
    - En hiver, date de la valeur minimale des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de novembre à avril)
    - En hiver, date de la dernière valeur de débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de novembre à avril)
    - En hiver, durée de la plus longue séquence continue avec des débits moyens sur 10 jours sous le seuil fixé au maximum des VCN10 (mois de novembre à avril)
    - En hiver, somme des écarts entre la moyenne sur 10 jours et le maximum des VCN10, sur la séquence la plus longue sous ce seuil (mois de novembre à avril)
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10_winter: agrégation annuelle [01-11, 30-04] - minimum de VC10 (VCN10_winter)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10_winter, pris comme seuil (upLim)
      P4:
        startLF_winter: agrégation annuelle [01-11, 30-04] - date du premier jour de la plus longue période sous upLim
        centerLF_winter: agrégation annuelle [01-11, 30-04] - date du minimum de VC10 sur la plus longue période sous upLim
        endLF_winter: agrégation annuelle [01-11, 30-04] - date du dernier jour de la plus longue période sous upLim
        dtLF_winter: agrégation annuelle [01-11, 30-04] - nombre de jours de la plus longue période sous upLim
        vLF_winter: agrégation annuelle [01-11, 30-04] - somme des volumes écoulés chaque jour de la plus longue période sous upLim
      P5:
        delta-startLF_winter: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
        delta-centerLF_winter: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
        delta-endLF_winter: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
        delta-dtLF_winter: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
        delta-vLF_winter: aucune agrégation temporelle - calcul du changement moyen entre la période historique et l'horizon {suffix.name}
    sampling_period:
    - 01-11
    - 30-04
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect:
      - saisonnalité
      - saisonnalité
      - saisonnalité
      - durée
      - intensité
      statistic: [écart, écart, écart, écart, écart]
      season: hivernale
      output: scalaire
    suffix_default:
      name: cible

  global:
    input_vars: "Q, ref_start, ref_end, horizon_start, horizon_end"
    preferred_sampling_period: "01-01"
    is_date: [true, true, true, false, false]
    relative: [false, false, false, false, true]
    palette:
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec", "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]
      - ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5", "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]
      - ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5", "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]
process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10_winter: [nanmin, "VC10"]
    time_step: year
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10_winter"]
    time_step: none
    keep: all

  P4:
    func:
      startLF_winter:  [apply_threshold, "VC10", {lim: upLim, where: "<=", what: first, select: longest}, true]
      centerLF_winter: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: nanargmin, select: longest}, true]
      endLF_winter:    [apply_threshold, "VC10", {lim: upLim, where: "<=", what: last, select: longest}, true]
      dtLF_winter:     [apply_threshold, "VC10", {lim: upLim, where: "<=", what: length, select: longest}]
      vLF_winter:      [deficit_volume, "VC10", {threshold: upLim}]
    time_step: year
    sampling_period: ["11-01", "04-30"]
    max_na_pct: 3

  P5:
    func:
      delta-startLF_winter: [delta, "startLF_winter", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
      delta-centerLF_winter: [delta, "centerLF_winter", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
      delta-endLF_winter: [delta, "endLF_winter", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
      delta-dtLF_winter: [delta, "dtLF_winter", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: false}]
      delta-vLF_winter: [delta, "vLF_winter", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: true}]
    time_step: none
