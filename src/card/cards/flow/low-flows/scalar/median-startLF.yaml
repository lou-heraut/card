id: median-startLF
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-startLF
    unit: yearday
    name: Inter-annual median of the start of low flows
    description: Median of the dates of the first 10-day mean flow below the maximum of the annual minima of the 10-day mean flow of daily VCN10
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10: annual aggregation [Month of maximum monthly flows] - minimum of VC10 (VCN10)
      P3:
        upLim: no temporal aggregation - the maximum of VCN10 is taken as the threshold (upLim)
      P4:
        startLF: annual aggregation [Month of maximum monthly flows] - date of the first day of the longest period below upLim
      P5:
        median-startLF: no temporal aggregation - median
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: timing
      season: annual
      output: scalar

  fr:
    variable: mediane-debutBE
    unit: "jour de l'année"
    name: Médiane inter-annuelle du début des basses eaux
    description: Médiane des dates de la première moyenne sur 10 jours sous le maximum des minimums annuels de la moyenne sur 10 jours du débit journalier VCN10
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10: agrégation annuelle [Mois du maximum des débits mensuels] - minimum de VC10 (VCN10)
      P3:
        upLim: aucune agrégation temporelle - le maximum de VCN10 est pris comme seuil (upLim)
      P4:
        startLF: agrégation annuelle [Mois du maximum des débits mensuels] - date du premier jour de la plus longue période sous upLim
      P5:
        median-startLF: aucune agrégation temporelle - médiane
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: saisonnalité
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    is_date: true
    relative: false
    palette: ["#60265e", "#893687", "#c05fbe", "#dba3da", "#edd1ec",
              "#f6ddd3", "#edbaa7", "#e08765", "#CD5629", "#8f3c1d"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10"]
    time_step: none
    keep: all

  P4:
    func:
      startLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: first, select: longest}, true]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P5:
    func:
      median-startLF: [circular_median, "startLF", {periodicity: 365.25}]
    time_step: none
