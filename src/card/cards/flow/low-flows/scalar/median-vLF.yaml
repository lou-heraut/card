id: median-vLF
version: "1.5"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-vLF
    unit: "hm^{3}"
    name: Inter-annual median of low-flow deficit volumes
    description: Median of sums of the differences between the 10-day average and the maximum of the VCN10, over the longest sequence below this threshold
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10: annual aggregation [month of maximum monthly flows] - minimum of VC10 (VCN10)
      P3:
        upLim: no temporal aggregation - maximum of VCN10, taken as the threshold (upLim)
      P4:
        vLF: annual aggregation [month of maximum monthly flows] - sum of volumes discharged each day in the longest period below upLim
      P5:
        median-vLF: no temporal aggregation - inter-annual median
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: annual
      output: scalar

  fr:
    variable: mediane-vBE
    unit: "hm^{3}"
    name: Médiane inter-annuelle des volumes de déficit des basses eaux
    description: Médiane des sommes des écarts entre la moyenne sur 10 jours et le maximum des VCN10, sur la séquence la plus longue sous ce seuil
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10: agrégation annuelle [mois du maximum des débits mensuels] - minimum de VC10 (VCN10)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10, pris comme seuil (upLim)
      P4:
        vLF: agrégation annuelle [mois du maximum des débits mensuels] - somme des volumes écoulés chaque jour de la plus longue période sous upLim
      P5:
        median-vLF: aucune agrégation temporelle - médiane inter-annuelle
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10"]
    time_step: none
    keep: all

  P4:
    func:
      vLF: [deficit_volume, "VC10", {threshold: upLim}]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P5:
    func:
      median-vLF: [nanmedian, "vLF"]
    time_step: none
