id: VCN30-2
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: VCN30-2
    unit: "m^{3}.s^{-1}"
    name: Annual minimum of 30-day mean daily discharge with a return period of 2 years
    description: ""
    method:
      P1:
        VC30: no temporal aggregation - 30-day centered moving average
      P2:
        VCN30: annual aggregation [month of maximum monthly flows] - minimum
      P3:
        VCN30-2: no temporal aggregation - calculation of the 2-year return period flow using the log-normal distribution
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: annual
      output: scalar

  fr:
    variable: VCN30-2
    unit: "m^{3}.s^{-1}"
    name: Minimum annuel de la moyenne sur 30 jours du débit journalier de période de retour 2 ans
    description: ""
    method:
      P1:
        VC30: aucune agrégation temporelle - moyenne mobile centrée sur 30 jours
      P2:
        VCN30: agrégation annuelle [mois du maximum des débits mensuels] - minimum
      P3:
        VCN30-2: aucune agrégation temporelle - calcul du débit de période de retour 2 ans avec la loi log-normal
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      VC30: [rollmean_center, "Q", {k: 30}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      VCN30: [nanmin, "VC30"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P3:
    func:
      VCN30-2: [return_level, "VCN30", {return_period: 2, water_type: "low"}]
    time_step: none
