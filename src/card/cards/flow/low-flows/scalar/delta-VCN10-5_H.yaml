id: delta-VCN10-5_H
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-21"

meta:
  en:
    variable: delta-VCN10-5
    unit: "%"
    name: Change of annual minimum of 10-day mean daily discharge with a return period of 5 years between the {suffix.name} horizon and historical period
    description: ""
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average
      P2:
        VCN10: annual aggregation [month of maximum monthly flows] - minimum
      P3:
        delta-VCN10-5: no temporal aggregation - calculation of the 5-year return period flow with the log-normal distribution on the historical period and in the {suffix.name} horizon then calculation of the average change
    suffix_default:
      name: target
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: magnitude
      season: annual
      output: scalar

  fr:
    variable: delta-VCN10-5
    unit: "%"
    name: Changement du minimum annuel de la moyenne sur 10 jours du débit journalier VCN10 de période de retour 5 ans entre l'horizon {suffix.name} et la période historique
    description: ""
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours
      P2:
        VCN10: agrégation annuelle [mois du maximum des débits mensuels] - minimum
      P3:
        delta-VCN10-5: aucune agrégation temporelle - calcul du débit de période de retour 5 ans avec la loi log-normal sur la période historique et en horizon {suffix.name} puis calcul du changement moyen
    suffix_default:
      name: cible
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: intensité
      season: annuelle
      output: scalaire

  global:
    input_vars: "Q, ref_start, ref_end, horizon_start, horizon_end"
    preferred_sampling_period: "01-01"
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P3:
    func:
      delta-VCN10-5: [delta, "VCN10", "date", {ref_start: "ref_start", ref_end: "ref_end", horizon_start: "horizon_start", horizon_end: "horizon_end", relative: true, return_period: 5, water_type: "low"}]
    time_step: none
