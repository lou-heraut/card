id: median-dtLF
version: "1.4"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-dtLF
    unit: day
    name: Inter-annual median of the duration of low flows
    description: Median of the durations of the longest continuous period with 10-day mean flows below the maximum of VCN10
    method:
      P1:
        VC10: no temporal aggregation - 10-day centered moving average (VC10)
      P2:
        VCN10: annual aggregation [Month of maximum monthly flows] - minimum of VC10 (VCN10)
      P3:
        upLim: no temporal aggregation - maximum of VCN10, taken as the threshold (upLim)
      P4:
        dtLF: annual aggregation [Month of maximum monthly flows] - number of days in the longest period below upLim
      P5:
        median-dtLF: no temporal aggregation - inter-annual median
    sampling_period: Month of maximum monthly flows
    classification:
      domain: flow
      phenomenon: low flows
      aspect: duration
      season: annual
      output: scalar

  fr:
    variable: mediane-dtBE
    unit: jour
    name: Médiane inter-annuelle de la durée des basses eaux
    description: Médiane des durées de la plus longue période continue de la moyenne sur 10 jours sous le maximum des VCN10
    method:
      P1:
        VC10: aucune agrégation temporelle - moyenne mobile centrée sur 10 jours (VC10)
      P2:
        VCN10: agrégation annuelle [Mois du maximum des débits mensuels] - minimum de VC10 (VCN10)
      P3:
        upLim: aucune agrégation temporelle - maximum de VCN10, pris comme seuil (upLim)
      P4:
        dtLF: agrégation annuelle [Mois du maximum des débits mensuels] - nombre de jours de la plus longue période sous upLim
      P5:
        median-dtLF: aucune agrégation temporelle - médiane inter-annuelle
    sampling_period: Mois du maximum des débits mensuels
    classification:
      domain: débit
      phenomenon: basses eaux
      aspect: durée
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    preferred_sampling_period: "01-01"
    relative: false
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      VC10: [rollmean_center, "Q", {k: 10}]
    time_step: none
    keep: all

  P2:
    func:
      VCN10: [nanmin, "VC10"]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3
    max_na_years: 10
    keep: all

  P3:
    func:
      upLim: [nanmax, "VCN10"]
    time_step: none
    keep: all

  P4:
    func:
      dtLF: [apply_threshold, "VC10", {lim: upLim, where: "<=", what: length, select: longest}]
    sampling_period:
      type: adaptive
      func: [nanmax, "Q"]
    max_na_pct: 3

  P5:
    func:
      median-dtLF: [nanmedian, "dtLF"]
    time_step: none
