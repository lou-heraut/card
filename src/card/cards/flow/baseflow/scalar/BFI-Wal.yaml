id: BFI-Wal
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: BFI-Wal
    unit: without unit
    name: Baseflow index (Wallingford)
    description: >-
      Ratio between mean inter-annual base flow and mean inter-annual
      flow, the base flow being separated from the hydrograph by the
      smoothed minima method (Wallingford)
    method:
      P1:
        BF-Wal: no temporal aggregation - extraction of the base flow (Wallingford)
      P2:
        BFI-Wal: no temporal aggregation - calculation of the Base Flow Index (BFI)
    classification:
      domain: flow
      phenomenon: baseflow
      aspect: magnitude
      statistic: ratio
      season: record
      output: scalar

  fr:
    variable: BFI-Wal
    unit: sans unité
    name: Indice de débit de base (Wallingford)
    description: >-
      Rapport entre débit de base moyen inter-annuel et débit moyen
      inter-annuel, le débit de base étant séparé de l'hydrogramme par la
      méthode des minima lissés (Wallingford)
    method:
      P1:
        BF-Wal: aucune agrégation temporelle - extraction du débit de base (Wallingford)
      P2:
        BFI-Wal: aucune agrégation temporelle - calcul du BFI
    classification:
      domain: débit
      phenomenon: débit de base
      aspect: intensité
      statistic: rapport
      season: chronique
      output: scalaire

  global:
    input_vars: Q
    source: >-
      TALLAKSEN, L. et H. VAN LANEN, éd. (2004). Hydrological drought. Processes
      and estimation methods for streamflow and groundwater. Developments in water
      science 48. Netherlands : Elsevier. ISBN : 9780444516886.
    relative: false

process:
  P1:
    func:
      BF-Wal: [baseflow, "Q", {method: Wal}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      BFI-Wal: [BFI, "Q", "BF-Wal"]
    time_step: none
