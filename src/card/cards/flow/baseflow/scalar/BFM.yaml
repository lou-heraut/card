id: BFM
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: BFM
    unit: without unit
    name: Baseflow magnitude
    description: >-
      Relative amplitude of the inter-annual daily regime of base flow:
      the gap between its maximum and its minimum, divided by the maximum
    method:
      P1:
        BF-Wal: no temporal aggregation - extraction of the base flow (Wallingford)
      P2:
        BFA: aggregation by day of the year - average of the base flow BFA
      P3:
        BFM: no temporal aggregation - calculation of the base flow magnitude BFM
    classification:
      domain: flow
      phenomenon: baseflow
      aspect: magnitude
      statistic: ratio
      season: record
      output: scalar

  fr:
    variable: BFM
    unit: sans unité
    name: Magnitude du débit de base
    description: >-
      Amplitude relative du régime journalier inter-annuel du débit de
      base : écart entre son maximum et son minimum, rapporté au maximum
    method:
      P1:
        BF-Wal: aucune agrégation temporelle - extraction du débit de base (Wallingford)
      P2:
        BFA: agrégation par jour de l'année - moyenne du débit de base BFA
      P3:
        BFM: aucune agrégation temporelle - calcul du BFM
    classification:
      domain: débit
      phenomenon: débit de base
      aspect: intensité
      statistic: rapport
      season: chronique
      output: scalaire

  global:
    input_vars: Q
    source: >-
      TALLAKSEN, L. et H. VAN LANEN, éd. (2004). Hydrological drought. Processes
      and estimation methods for streamflow and groundwater. Developments in water
      science 48. Netherlands : Elsevier. ISBN : 9780444516886.
    is_date: false
    relative: false

process:
  P1:
    func:
      BF-Wal: [baseflow, "Q", {method: Wal}]
    time_step: none
    keep: all
    max_na_years: 10

  P2:
    func:
      BFA: [nanmean, "BF-Wal"]
    time_step: yearday
    max_na_pct: 3

  P3:
    func:
      BFM: [BFM, "BFA"]
    time_step: none
