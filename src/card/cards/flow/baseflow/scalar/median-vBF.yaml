id: median-vBF
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable: median-vBF
    unit: "hm^{3}"
    name: Inter-annual median of the annual volume generated by base flow
    description: >-
      Sum of the daily volumes of base flow, separated from the hydrograph
      by the smoothed minima method (Wallingford)
    method:
      P1:
        vBF: annual aggregation [09-01, 08-31] - sum of volumes discharged each day for base flow (Wallingford)
      P2:
        median-vBF: no temporal aggregation - inter-annual median
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: flow
      phenomenon: baseflow
      aspect: magnitude
      statistic: median
      season: annual
      output: scalar

  fr:
    variable: mediane-vQB
    unit: "hm^{3}"
    name: Médiane inter-annuelle du volume annuel généré par les écoulements lents
    description: >-
      Somme des volumes journaliers du débit de base, séparé de
      l'hydrogramme par la méthode des minima lissés (Wallingford)
    method:
      P1:
        vBF: agrégation annuelle [01-09, 31-08] - somme des volumes écoulés chaque jour pour le débit de base (Wallingford)
      P2:
        median-vBF: aucune agrégation temporelle - médiane inter-annuelle
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: débit
      phenomenon: débit de base
      aspect: intensité
      statistic: médiane
      season: annuelle
      output: scalaire

  global:
    input_vars: Q
    source: >-
      TALLAKSEN, L. et H. VAN LANEN, éd. (2004). Hydrological drought. Processes
      and estimation methods for streamflow and groundwater. Developments in water
      science 48. Netherlands : Elsevier. ISBN : 9780444516886.
    preferred_sampling_period: "09-01"
    relative: true
    palette: ["#003C30", "#01665E", "#35978F", "#80CDC1", "#C7EAE5",
              "#F6E8C3", "#DFC27D", "#BF812D", "#8C510A", "#543005"]

process:
  P1:
    func:
      vBF: [snowmelt_volume, "Q", {method: Wal}]
    time_step: year
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10

  P2:
    func:
      median-vBF: [nanmedian, "vBF"]
    time_step: none
