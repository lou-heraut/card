id: epsilon_R
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-16"

meta:
  en:
    variable: epsilon_R
    unit: without unit
    name: Annual flow elasticity to precipitation
    description: >-
      Relative change in flow for a 1 % relative change in precipitation,
      estimated as the median of the inter-annual departures scaled by
      their means
    method:
      P1:
        QA: annual aggregation [Month of minimum monthly flows] - mean flow
        RA-mean: annual aggregation [Month of minimum monthly flows] - mean total precipitation
      P2:
        epsilon_R: no temporal aggregation - calculation of elasticity ε
    sampling_period: Month of minimum monthly flows
    classification:
      domain: [flow, precipitation]
      season: annual
      output: scalar
      purpose: climate sensitivity

  fr:
    variable: epsilon_R
    unit: sans unité
    name: Élasticité annuelle du débit aux précipitations
    description: >-
      Variation relative du débit pour une variation relative de 1 % des
      précipitations, estimée par la médiane des écarts inter-annuels
      rapportés à leurs moyennes
    method:
      P1:
        QA: agrégation annuelle [Mois du minimum des débits mensuels] - débit moyen
        RA-mean: agrégation annuelle [Mois du minimum des débits mensuels] - précipitations totales moyennes
      P2:
        epsilon_R: aucune agrégation temporelle - calcul de l'élasticité ε
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: [débit, précipitations]
      season: annuelle
      output: scalaire
      purpose: sensibilité climatique

  global:
    input_vars: "Q, R"
    preferred_sampling_period: "09-01"
    source: |
      SANKARASUBRAMANIAN, A., R. M. VOGEL et J. F. LIMBRUNNER (1991). « Climate elasticity of streamflow in the United States ». In : Water Resour. Res. 37, p. 1771-1781.

process:
  P1:
    func:
      QA: [nanmean, "Q"]
      RA-mean: [nanmean, "R"]
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      epsilon_R: [elasticity, {Q: "QA", X: "RA-mean"}]
    time_step: none
    max_na_pct: 3
