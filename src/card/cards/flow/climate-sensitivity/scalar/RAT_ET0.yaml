id: RAT_ET0
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: RAT_ET0
    unit: bool
    name: Robustness test to a variation in reference evapotranspiration
    description: >-
      True when the model bias is correlated with the reference
      evapotranspiration, in the sense of a Spearman correlation
      significant at the 5 % level: performance then depends on that
      variable, so the model does not behave the same everywhere
    method:
      P1:
        BiasA: annual aggregation [09-01, 08-31] - relative bias of simulated vs observed flow
        ET0A: annual aggregation [09-01, 08-31] - mean reference evapotranspiration
      P2:
        RAT_ET0: no temporal aggregation - RAT with a 5 % significance level
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: [flow, evapotranspiration]
      season: annual
      output: scalar
      purpose: climate sensitivity

  fr:
    variable: RAT_ET0
    unit: bool
    name: Test de robustesse à une variation d'évapotranspiration de référence
    description: >-
      Vrai quand le biais du modèle est corrélé à l'évapotranspiration de
      référence, au sens d'une corrélation de Spearman significative au
      seuil de 5 % : la performance dépend alors de cette variable, donc
      le modèle ne se comporte pas de la même façon partout
    method:
      P1:
        BiasA: agrégation annuelle [01-09, 31-08] - biais relatif entre débits simulés et observés
        ET0A: agrégation annuelle [01-09, 31-08] - évapotranspiration de référence moyenne
      P2:
        RAT_ET0: aucune agrégation temporelle - RAT avec un seuil de significativité de 5 %
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: [débit, évapotranspiration]
      season: annuelle
      output: scalaire
      purpose: sensibilité climatique

  global:
    input_vars: "Q_obs, Q_sim, ET0_obs"
    relative: false
    source: |
      NICOLLE, P. et al. (2021). « Technical note : RAT – a robustness assessment test for calibrated and uncalibrated hydrological models ». In : Hydrol. Earth Syst. Sci. 25, p. 5013-5027. DOI : 10.5194/hess-25-5013-2021.

process:
  P1:
    func:
      BiasA:  [bias, "Q_obs", "Q_sim"]
      ET0A:   [nanmean, "ET0_obs"]
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      RAT_ET0: [RAT, "BiasA", "ET0A", {thresh: 0.05}]
    time_step: none
