id: epsilon_T
version: "2.0"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-16"

meta:
  en:
    variable: epsilon_T
    unit: without unit
    name: Annual flow elasticity to air temperatures
    description: >-
      Relative change in flow for a 1 % relative change in air
      temperature, estimated as the median of the inter-annual departures
      scaled by their means
    method:
      P1:
        QA: annual aggregation [month of minimum monthly flows] - mean flow
        TA: annual aggregation [month of minimum monthly flows] - mean temperatures
      P2:
        epsilon_T: no temporal aggregation - calculation of elasticity ε
    sampling_period: Month of minimum monthly flows
    classification:
      domain: [flow, temperature]
      statistic: elasticity
      season: annual
      output: scalar
      purpose: climate sensitivity

  fr:
    variable: epsilon_T
    unit: sans unité
    name: Élasticité annuelle du débit aux températures de l'air
    description: >-
      Variation relative du débit pour une variation relative de 1 % de la
      température de l'air, estimée par la médiane des écarts
      inter-annuels rapportés à leurs moyennes
    method:
      P1:
        QA: agrégation annuelle [mois du minimum des débits mensuels] - débit moyen
        TA: agrégation annuelle [mois du minimum des débits mensuels] - températures moyennes
      P2:
        epsilon_T: aucune agrégation temporelle - calcul de l'élasticité ε
    sampling_period: Mois du minimum des débits mensuels
    classification:
      domain: [débit, température]
      statistic: élasticité
      season: annuelle
      output: scalaire
      purpose: sensibilité climatique

  global:
    input_vars: "Q, T"
    preferred_sampling_period: "09-01"
    source: |
      SANKARASUBRAMANIAN, A., R. M. VOGEL et J. F. LIMBRUNNER (1991). « Climate elasticity of streamflow in the United States ». In : Water Resour. Res. 37, p. 1771-1781.
    relative: false

process:
  P1:
    func:
      QA: [nanmean, "Q"]
      TA: [nanmean, "T"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmin, "Q"]
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      epsilon_T: [elasticity, {Q: "QA", X: "TA"}]
    time_step: none
