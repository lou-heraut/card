id: RAT_R
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: RAT_R
    unit: bool
    name: Robustness test to a variation in precipitation
    description: >-
      True when the model bias is correlated with precipitation, in the
      sense of a Spearman correlation significant at the 5 % level:
      performance then depends on that variable, so the model does not
      behave the same everywhere
    method:
      P1:
        BiasA: annual aggregation [09-01, 08-31] - relative bias of simulated vs observed flow
        RA-mean: annual aggregation [09-01, 08-31] - mean precipitation
      P2:
        RAT_R: no temporal aggregation - RAT with a 5 % significance level
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: [flow, precipitation]
      season: annual
      output: scalar
      purpose: climate sensitivity

  fr:
    variable: RAT_R
    unit: bool
    name: Test de robustesse à une variation de précipitations
    description: >-
      Vrai quand le biais du modèle est corrélé aux précipitations, au
      sens d'une corrélation de Spearman significative au seuil de 5 % :
      la performance dépend alors de cette variable, donc le modèle ne se
      comporte pas de la même façon partout
    method:
      P1:
        BiasA: agrégation annuelle [01-09, 31-08] - biais relatif entre débits simulés et observés
        RA-mean: agrégation annuelle [01-09, 31-08] - précipitations moyennes
      P2:
        RAT_R: aucune agrégation temporelle - RAT avec un seuil de significativité de 5 %
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: [débit, précipitations]
      season: annuelle
      output: scalaire
      purpose: sensibilité climatique

  global:
    input_vars: "Q_obs, Q_sim, R_obs"
    relative: false
    source: |
      NICOLLE, P. et al. (2021). « Technical note : RAT – a robustness assessment test for calibrated and uncalibrated hydrological models ». In : Hydrol. Earth Syst. Sci. 25, p. 5013-5027. DOI : 10.5194/hess-25-5013-2021.

process:
  P1:
    func:
      BiasA: [bias, "Q_obs", "Q_sim"]
      RA-mean:    [nanmean, "R_obs"]
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      RAT_R: [RAT, "BiasA", "RA-mean", {thresh: 0.05}]
    time_step: none
