id: RSA_season
version: "1.0.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: [RSA_DJF, RSA_MAM, RSA_JJA, RSA_SON]
    unit: mm
    name:
      - Cumulative daily precipitation of each winter
      - Cumulative daily precipitation of each spring
      - Cumulative daily precipitation of each summer
      - Cumulative daily precipitation of each autumn
    description:
      - "Months of December, January, and February"
      - "Months of March, April, and May"
      - "Months of June, July, and August"
      - "Months of September, October, and November"
    method:
      P1:
        RSA_DJF: seasonal annual aggregation [12-01, 02-28(29)] - sum
        RSA_MAM: seasonal annual aggregation [03-01, 05-31] - sum
        RSA_JJA: seasonal annual aggregation [06-01, 08-31] - sum
        RSA_SON: seasonal annual aggregation [09-01, 11-30] - sum
    sampling_period:
      - ["12-01", "02-28(29)"]
      - ["03-01", "05-31"]
      - ["06-01", "08-31"]
      - ["09-01", "11-30"]
    classification:
      domain: precipitation
      phenomenon: mean precipitation
      aspect: magnitude
      statistic: [sum, sum, sum, sum]
      season: by season
      output: series

  fr:
    variable: [RSA_DJF, RSA_MAM, RSA_JJA, RSA_SON]
    unit: mm
    name:
      - Cumul des précipitations journalières de chaque hiver
      - Cumul des précipitations journalières de chaque printemps
      - Cumul des précipitations journalières de chaque été
      - Cumul des précipitations journalières de chaque automne
    description:
      - "Mois de décembre, janvier et février"
      - "Mois de mars, avril et mai"
      - "Mois de juin, juillet et août"
      - "Mois de septembre, octobre et novembre"
    method:
      P1:
        RSA_DJF: agrégation annuelle saisonnalisée [01-12, 28(29)-02] - somme
        RSA_MAM: agrégation annuelle saisonnalisée [01-03, 31-05] - somme
        RSA_JJA: agrégation annuelle saisonnalisée [01-06, 31-08] - somme
        RSA_SON: agrégation annuelle saisonnalisée [01-09, 30-11] - somme
    sampling_period:
      - ["01-12", "28(29)-02"]
      - ["01-03", "31-05"]
      - ["01-06", "31-08"]
      - ["01-09", "30-11"]
    classification:
      domain: précipitations
      phenomenon: précipitations moyennes
      aspect: intensité
      statistic: [somme, somme, somme, somme]
      season: par saison
      output: série

  global:
    input_vars: R
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RSA: [nansum_strict, "R"]
    time_step: year-season
    seasons: [DJF, MAM, JJA, SON]
    max_na_pct: 3
    max_na_years: 10
    compress: true
