id: RAl
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: RAl
    unit: mm
    name: Annual liquid precipitation
    description: ""
    method:
      P1:
        RAl: annual aggregation [09-01, 08-31] - sum
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: precipitation
      phenomenon: mean precipitation
      aspect: magnitude
      statistic: sum
      season: annual
      output: series

  fr:
    variable: RAl
    unit: mm
    name: Cumul annuel des précipitations liquides
    description: ""
    method:
      P1:
        RAl: agrégation annuelle [01-09, 31-08] - somme
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: précipitations
      phenomenon: précipitations moyennes
      aspect: intensité
      statistic: somme
      season: annuelle
      output: série

  global:
    input_vars: Rl
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RAl: [nansum_strict, "Rl"]
    time_step: year
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
