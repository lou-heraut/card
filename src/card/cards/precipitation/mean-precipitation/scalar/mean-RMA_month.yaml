        mean-RMA_oct: no temporal aggregation - inter-annual mean
        mean-RMA_nov: no temporal aggregation - inter-annual mean
        mean-RMA_dec: no temporal aggregation - inter-annual mean
    sampling_period:
      - ["01-01", "01-31"]
      - ["02-01", "02-28(29)"]
      - ["03-01", "03-31"]
      - ["04-01", "04-30"]
      - ["05-01", "05-31"]
      - ["06-01", "06-30"]
      - ["07-01", "07-31"]
      - ["08-01", "08-31"]
      - ["09-01", "09-30"]
      - ["10-01", "10-31"]
      - ["11-01", "11-30"]
      - ["12-01", "12-31"]
    classification:
      domain: precipitation
      phenomenon: mean precipitation
      aspect: magnitude
      statistic:
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
        - mean
      season: by month
      output: scalar

  fr:
    variable:
      - moyenne-RMA_janv
      - moyenne-RMA_fevr
      - moyenne-RMA_mars
      - moyenne-RMA_avril
      - moyenne-RMA_mai
      - moyenne-RMA_juin
      - moyenne-RMA_juil
      - moyenne-RMA_aout
      - moyenne-RMA_sept
      - moyenne-RMA_oct
      - moyenne-RMA_nov
      - moyenne-RMA_dec
    unit: mm
    name:
      - Moyenne inter-annuelle des précipitations totales de janvier
      - Moyenne inter-annuelle des précipitations totales de février
      - Moyenne inter-annuelle des précipitations totales de mars
      - Moyenne inter-annuelle des précipitations totales d'avril
