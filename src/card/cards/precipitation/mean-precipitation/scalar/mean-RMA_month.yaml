id: mean-RMA_month
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-18"

meta:
  en:
    variable:
      - mean-RMA_jan
      - mean-RMA_feb
      - mean-RMA_mar
      - mean-RMA_apr
      - mean-RMA_may
      - mean-RMA_jun
      - mean-RMA_jul
      - mean-RMA_aug
      - mean-RMA_sep
      - mean-RMA_oct
      - mean-RMA_nov
      - mean-RMA_dec
    unit: mm
    name:
      - Inter-annual mean of January total precipitation
      - Inter-annual mean of February total precipitation
      - Inter-annual mean of March total precipitation
      - Inter-annual mean of April total precipitation
      - Inter-annual mean of May total precipitation
      - Inter-annual mean of June total precipitation
      - Inter-annual mean of July total precipitation
      - Inter-annual mean of August total precipitation
      - Inter-annual mean of September total precipitation
      - Inter-annual mean of October total precipitation
      - Inter-annual mean of November total precipitation
      - Inter-annual mean of December total precipitation
    description: ""
    method:
      P1:
        RMA_jan: monthly aggregation for each year - sum
        RMA_feb: monthly aggregation for each year - sum
        RMA_mar: monthly aggregation for each year - sum
        RMA_apr: monthly aggregation for each year - sum
        RMA_may: monthly aggregation for each year - sum
        RMA_jun: monthly aggregation for each year - sum
        RMA_jul: monthly aggregation for each year - sum
        RMA_aug: monthly aggregation for each year - sum
        RMA_sep: monthly aggregation for each year - sum
        RMA_oct: monthly aggregation for each year - sum
        RMA_nov: monthly aggregation for each year - sum
        RMA_dec: monthly aggregation for each year - sum
      P2:
        mean-RMA_jan: no temporal aggregation - inter-annual mean
        mean-RMA_feb: no temporal aggregation - inter-annual mean
        mean-RMA_mar: no temporal aggregation - inter-annual mean
        mean-RMA_apr: no temporal aggregation - inter-annual mean
        mean-RMA_may: no temporal aggregation - inter-annual mean
