        mean-RMA_feb: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_mar: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_apr: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_may: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_jun: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_jul: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_aug: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_sep: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_oct: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_nov: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RMA_dec: aucune agrégation temporelle - moyenne inter-annuelle
