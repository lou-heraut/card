id: RCXA5
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-07-16"

meta:
  en:
    variable: RCXA5
    unit: mm
    name: Annual maximum of 5-day cumulative daily precipitation
    description: ""
    method:
      P1:
        RC5: no temporal aggregation - 5-day centered moving sum
      P2:
        RCXA5: annual aggregation [month of minimum monthly precipitation] - maximum
    sampling_period: Month of minimum monthly precipitation
    classification:
      domain: precipitation
      phenomenon: heavy rain
      aspect: magnitude
      statistic: maximum
      season: annual
      output: series

  fr:
    variable: RCXA5
    unit: mm
    name: Maximum annuel du cumul sur 5 jours des précipitations journalières
    description: ""
    method:
      P1:
        RC5: aucune agrégation temporelle - somme mobile centrée sur 5 jours
      P2:
        RCXA5: agrégation annuelle [mois du minimum des précipitations mensuelles] - maximum
    sampling_period: Mois du minimum des précipitations mensuelles
    classification:
      domain: précipitations
      phenomenon: pluies fortes
      aspect: intensité
      statistic: maximum
      season: annuelle
      output: série

  global:
    input_vars: R
    preferred_sampling_period: "09-01"
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RC5: [rollsum_center, "R", {k: 5}]
    time_step: none
    keep: all
    max_na_years: 10
  P2:
    func:
      RCXA5: [nanmax, "RC5"]
    time_step: year
    sampling_period:
      type: adaptive
      func: [nanmin, "R"]
    max_na_pct: 3
