id: CR
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: CR
    unit: "without unit"
    name: Correction coefficient for precipitation
    description: >-
      Ratio between the simulated and the observed annual precipitation
      totals, both averaged over the record
    method:
      P1:
        RA_obs: annual aggregation [09-01, 08-31] - sum of observed precipitation
        RA_sim: annual aggregation [09-01, 08-31] - sum of simulated precipitation
      P2:
        mean-RA_obs: no temporal aggregation - inter-annual mean
        mean-RA_sim: no temporal aggregation - inter-annual mean
      P3:
        CR: no temporal aggregation - simulated/observed ratio
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: precipitation
      statistic: ratio
      season: annual
      output: scalar
      purpose: model performance

  fr:
    variable: CR
    unit: "sans unité"
    name: Coefficient correctif des précipitations
    description: >-
      Rapport entre le cumul annuel de précipitations simulé et le cumul
      observé, tous deux moyennés sur la chronique
    method:
      P1:
        RA_obs: agrégation annuelle [01-09, 31-08] - somme des précipitations observées
        RA_sim: agrégation annuelle [01-09, 31-08] - somme des précipitations simulées
      P2:
        mean-RA_obs: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RA_sim: aucune agrégation temporelle - moyenne inter-annuelle
      P3:
        CR: aucune agrégation temporelle - rapport simulé/observé
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: précipitations
      statistic: rapport
      season: annuelle
      output: scalaire
      purpose: performance de modèle

  global:
    input_vars: "R_obs, R_sim"
    is_date: false
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RA_obs: [nansum_strict, "R_obs"]
      RA_sim: [nansum_strict, "R_sim"]
    time_step: year
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10

  P2:
    func:
      mean-RA_obs: [nanmean, "RA_obs"]
      mean-RA_sim: [nanmean, "RA_sim"]
    time_step: none

  P3:
    func:
      CR: [ratio, "mean-RA_sim", "mean-RA_obs"]
    time_step: none
