id: CRS_season
version: "1.2"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: [CRS_DJF, CRS_MAM, CRS_JJA, CRS_SON]
    unit: "without unit"
    name:
      - Winter precipitation correction coefficient
      - Spring precipitation correction coefficient
      - Summer precipitation correction coefficient
      - Autumn precipitation correction coefficient
    description:
      - Ratio between the simulated and the observed precipitation totals
        over December, January and February, both averaged over the record
      - Ratio between the simulated and the observed precipitation totals
        over March, April and May, both averaged over the record
      - Ratio between the simulated and the observed precipitation totals
        over June, July and August, both averaged over the record
      - Ratio between the simulated and the observed precipitation totals
        over September, October and November, both averaged over the record
    method:
      P1:
        RSA_obs_DJF: seasonal annual aggregation - sum of observed precipitation
        RSA_obs_MAM: seasonal annual aggregation - sum of observed precipitation
        RSA_obs_JJA: seasonal annual aggregation - sum of observed precipitation
        RSA_obs_SON: seasonal annual aggregation - sum of observed precipitation
        RSA_sim_DJF: seasonal annual aggregation - sum of simulated precipitation
        RSA_sim_MAM: seasonal annual aggregation - sum of simulated precipitation
        RSA_sim_JJA: seasonal annual aggregation - sum of simulated precipitation
        RSA_sim_SON: seasonal annual aggregation - sum of simulated precipitation
      P2:
        mean-RSA_obs_DJF: no temporal aggregation - inter-annual mean
        mean-RSA_obs_MAM: no temporal aggregation - inter-annual mean
        mean-RSA_obs_JJA: no temporal aggregation - inter-annual mean
        mean-RSA_obs_SON: no temporal aggregation - inter-annual mean
        mean-RSA_sim_DJF: no temporal aggregation - inter-annual mean
        mean-RSA_sim_MAM: no temporal aggregation - inter-annual mean
        mean-RSA_sim_JJA: no temporal aggregation - inter-annual mean
        mean-RSA_sim_SON: no temporal aggregation - inter-annual mean
      P3:
        CRS_DJF: no temporal aggregation - simulated/observed ratio for each season
        CRS_MAM: no temporal aggregation - simulated/observed ratio for each season
        CRS_JJA: no temporal aggregation - simulated/observed ratio for each season
        CRS_SON: no temporal aggregation - simulated/observed ratio for each season
    sampling_period:
      - ["12-01", "02-28(29)"]
      - ["03-01", "05-31"]
      - ["06-01", "08-31"]
      - ["09-01", "11-30"]
    classification:
      domain: precipitation
      statistic: [ratio, ratio, ratio, ratio]
      season: by season
      output: scalar
      purpose: model performance

  fr:
    variable: [CRS_DJF, CRS_MAM, CRS_JJA, CRS_SON]
    unit: "sans unité"
    name:
      - Coefficient correctif des précipitations hivernales
      - Coefficient correctif des précipitations printanières
      - Coefficient correctif des précipitations estivales
      - Coefficient correctif des précipitations automnales
    description:
      - Rapport entre le cumul de précipitations simulé et le cumul observé
        sur les mois de décembre, janvier et février, tous deux moyennés sur
        la chronique
      - Rapport entre le cumul de précipitations simulé et le cumul observé
        sur les mois de mars, avril et mai, tous deux moyennés sur la
        chronique
      - Rapport entre le cumul de précipitations simulé et le cumul observé
        sur les mois de juin, juillet et août, tous deux moyennés sur la
        chronique
      - Rapport entre le cumul de précipitations simulé et le cumul observé
        sur les mois de septembre, octobre et novembre, tous deux moyennés
        sur la chronique
    method:
      P1:
        RSA_obs_DJF: agrégation annuelle saisonnalisée - somme des précipitations observées
        RSA_obs_MAM: agrégation annuelle saisonnalisée - somme des précipitations observées
        RSA_obs_JJA: agrégation annuelle saisonnalisée - somme des précipitations observées
        RSA_obs_SON: agrégation annuelle saisonnalisée - somme des précipitations observées
        RSA_sim_DJF: agrégation annuelle saisonnalisée - somme des précipitations simulées
        RSA_sim_MAM: agrégation annuelle saisonnalisée - somme des précipitations simulées
        RSA_sim_JJA: agrégation annuelle saisonnalisée - somme des précipitations simulées
        RSA_sim_SON: agrégation annuelle saisonnalisée - somme des précipitations simulées
      P2:
        mean-RSA_obs_DJF: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_obs_MAM: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_obs_JJA: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_obs_SON: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_sim_DJF: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_sim_MAM: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_sim_JJA: aucune agrégation temporelle - moyenne inter-annuelle
        mean-RSA_sim_SON: aucune agrégation temporelle - moyenne inter-annuelle
      P3:
        CRS_DJF: aucune agrégation temporelle - rapport simulé/observé pour chaque saison
        CRS_MAM: aucune agrégation temporelle - rapport simulé/observé pour chaque saison
        CRS_JJA: aucune agrégation temporelle - rapport simulé/observé pour chaque saison
        CRS_SON: aucune agrégation temporelle - rapport simulé/observé pour chaque saison
    sampling_period:
      - ["01-12", "28(29)-02"]
      - ["01-03", "31-05"]
      - ["01-06", "31-08"]
      - ["01-09", "30-11"]
    classification:
      domain: précipitations
      statistic: [rapport, rapport, rapport, rapport]
      season: par saison
      output: scalaire
      purpose: performance de modèle

  global:
    input_vars: "R_obs, R_sim"
    is_date: false
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RSA_obs: [nansum_strict, "R_obs"]
      RSA_sim: [nansum_strict, "R_sim"]
    time_step: year-season
    seasons: [DJF, MAM, JJA, SON]
    max_na_pct: 3
    max_na_years: 10
    compress: true

  P2:
    func:
      mean-RSA_obs_DJF: [nanmean, "RSA_obs_DJF"]
      mean-RSA_obs_MAM: [nanmean, "RSA_obs_MAM"]
      mean-RSA_obs_JJA: [nanmean, "RSA_obs_JJA"]
      mean-RSA_obs_SON: [nanmean, "RSA_obs_SON"]
      mean-RSA_sim_DJF: [nanmean, "RSA_sim_DJF"]
      mean-RSA_sim_MAM: [nanmean, "RSA_sim_MAM"]
      mean-RSA_sim_JJA: [nanmean, "RSA_sim_JJA"]
      mean-RSA_sim_SON: [nanmean, "RSA_sim_SON"]
    time_step: none

  P3:
    func:
      CRS_DJF: [ratio, "mean-RSA_sim_DJF", "mean-RSA_obs_DJF"]
      CRS_MAM: [ratio, "mean-RSA_sim_MAM", "mean-RSA_obs_MAM"]
      CRS_JJA: [ratio, "mean-RSA_sim_JJA", "mean-RSA_obs_JJA"]
      CRS_SON: [ratio, "mean-RSA_sim_SON", "mean-RSA_obs_SON"]
    time_step: none
