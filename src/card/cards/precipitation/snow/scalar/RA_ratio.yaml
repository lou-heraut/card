id: RA_ratio
version: "1.0.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: [Rl_ratio, Rs_ratio]
    unit: [without unit, without unit]
    name:
      - "Ratio of liquid to total precipitation"
      - "Ratio of solid to total precipitation"
    description: ""
    method:
      P1:
        RA: annual aggregation [09-01, 08-31] - sums of total, liquid and solid precipitation
        RAl: annual aggregation [09-01, 08-31] - sums of total, liquid and solid precipitation
        RAs: annual aggregation [09-01, 08-31] - sums of total, liquid and solid precipitation
      P2:
        mean-RA: no temporal aggregation - inter-annual means
        mean-RAl: no temporal aggregation - inter-annual means
        mean-RAs: no temporal aggregation - inter-annual means
      P3:
        Rl_ratio: no temporal aggregation - liquid/total and solid/total ratios
        Rs_ratio: no temporal aggregation - liquid/total and solid/total ratios
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: precipitation
      phenomenon: snow
      aspect: magnitude
      season: annual
      output: scalar

  fr:
    variable: [Rl_ratio, Rs_ratio]
    unit: [sans unité, sans unité]
    name:
      - "Rapport des précipitations liquides aux précipitations totales"
      - "Rapport des précipitations solides aux précipitations totales"
    description: ""
    method:
      P1:
        RA: agrégation annuelle [01-09, 31-08] - sommes des précipitations totales, liquides et solides
        RAl: agrégation annuelle [01-09, 31-08] - sommes des précipitations totales, liquides et solides
        RAs: agrégation annuelle [01-09, 31-08] - sommes des précipitations totales, liquides et solides
      P2:
        mean-RA: aucune agrégation temporelle - moyennes inter-annuelles
        mean-RAl: aucune agrégation temporelle - moyennes inter-annuelles
        mean-RAs: aucune agrégation temporelle - moyennes inter-annuelles
      P3:
        Rl_ratio: aucune agrégation temporelle - rapports liquide/total et solide/total
        Rs_ratio: aucune agrégation temporelle - rapports liquide/total et solide/total
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: précipitations
      phenomenon: neige
      aspect: intensité
      season: annuelle
      output: scalaire

  global:
    input_vars: "R, Rl, Rs"
    relative: false

process:
  P1:
    func:
      RA:  [nansum_strict, "R"]
      RAl: [nansum_strict, "Rl"]
      RAs: [nansum_strict, "Rs"]
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      mean-RA:  [nanmean, "RA"]
      mean-RAl: [nanmean, "RAl"]
      mean-RAs: [nanmean, "RAs"]
    time_step: none
  P3:
    func:
      Rl_ratio: [ratio, "mean-RAl", "mean-RA"]
      Rs_ratio: [ratio, "mean-RAs", "mean-RA"]
    time_step: none
