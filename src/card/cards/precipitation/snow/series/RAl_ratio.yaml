id: RAl_ratio
version: "1.1"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable: RAl_ratio
    unit: without unit
    name: Ratio of annual liquid precipitation to total annual precipitation
    description: ""
    method:
      P1:
        RA: annual aggregation [09-01, 08-31] - sum of total precipitation
        RAl: annual aggregation [09-01, 08-31] - sum of liquid precipitation
      P2:
        RAl_ratio: no temporal aggregation - liquid/total ratio
    sampling_period: ["09-01", "08-31"]
    classification:
      domain: precipitation
      phenomenon: snow
      aspect: magnitude
      statistic: ratio
      season: annual
      output: series

  fr:
    variable: RAl_ratio
    unit: sans unité
    name: Ratio des précipitations annuelles liquides sur les précipitations annuelles totales
    description: ""
    method:
      P1:
        RA: agrégation annuelle [01-09, 31-08] - somme des précipitations totales
        RAl: agrégation annuelle [01-09, 31-08] - somme des précipitations liquides
      P2:
        RAl_ratio: aucune agrégation temporelle - rapport liquide/total
    sampling_period: ["01-09", "31-08"]
    classification:
      domain: précipitations
      phenomenon: neige
      aspect: intensité
      statistic: rapport
      season: annuelle
      output: série

  global:
    input_vars: "R, Rl"
    is_date: false
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RA:  [nansum_strict, "R"]
      RAl: [nansum_strict, "Rl"]
    time_step: year
    sampling_period: "09-01"
    max_na_pct: 3
    max_na_years: 10
  P2:
    func:
      RAl_ratio: [ratio, "RAl", "RA"]

    time_step: year