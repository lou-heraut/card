id: RMAs_month
version: "2.0"
authors: ["Louis Héraut (INRAE, UR RiverLy)"]
date: "2026-04-26"

meta:
  en:
    variable:
      - RMAs_jan
      - RMAs_feb
      - RMAs_mar
      - RMAs_apr
      - RMAs_may
      - RMAs_jun
      - RMAs_jul
      - RMAs_aug
      - RMAs_sep
      - RMAs_oct
      - RMAs_nov
      - RMAs_dec
    unit: mm
    name:
      - Cumulative daily solid precipitation for each January
      - Cumulative daily solid precipitation for each February
      - Cumulative daily solid precipitation for each March
      - Cumulative daily solid precipitation for each April
      - Cumulative daily solid precipitation for each May
      - Cumulative daily solid precipitation for each June
      - Cumulative daily solid precipitation for each July
      - Cumulative daily solid precipitation for each August
      - Cumulative daily solid precipitation for each September
      - Cumulative daily solid precipitation for each October
      - Cumulative daily solid precipitation for each November
      - Cumulative daily solid precipitation for each December
    description: ""
    method:
      P1:
        RMAs_jan: monthly aggregation for each year - sum
        RMAs_feb: monthly aggregation for each year - sum
        RMAs_mar: monthly aggregation for each year - sum
        RMAs_apr: monthly aggregation for each year - sum
        RMAs_may: monthly aggregation for each year - sum
        RMAs_jun: monthly aggregation for each year - sum
        RMAs_jul: monthly aggregation for each year - sum
        RMAs_aug: monthly aggregation for each year - sum
        RMAs_sep: monthly aggregation for each year - sum
        RMAs_oct: monthly aggregation for each year - sum
        RMAs_nov: monthly aggregation for each year - sum
        RMAs_dec: monthly aggregation for each year - sum
    sampling_period:
      - ["01-01", "01-31"]
      - ["02-01", "02-28(29)"]
      - ["03-01", "03-31"]
      - ["04-01", "04-30"]
      - ["05-01", "05-31"]
      - ["06-01", "06-30"]
      - ["07-01", "07-31"]
      - ["08-01", "08-31"]
      - ["09-01", "09-30"]
      - ["10-01", "10-31"]
      - ["11-01", "11-30"]
      - ["12-01", "12-31"]
    classification:
      domain: precipitation
      phenomenon: snow
      aspect: magnitude
      statistic: [sum, sum, sum, sum, sum, sum, sum, sum, sum, sum, sum, sum]
      season: by month
      output: series

  fr:
    variable:
      - RMAs_janv
      - RMAs_fevr
      - RMAs_mars
      - RMAs_avril
      - RMAs_mai
      - RMAs_juin
      - RMAs_juil
      - RMAs_aout
      - RMAs_sept
      - RMAs_oct
      - RMAs_nov
      - RMAs_dec
    unit: mm
    name:
      - Cumul des précipitations solides journalières de chaque janvier
      - Cumul des précipitations solides journalières de chaque février
      - Cumul des précipitations solides journalières de chaque mars
      - Cumul des précipitations solides journalières de chaque avril
      - Cumul des précipitations solides journalières de chaque mai
      - Cumul des précipitations solides journalières de chaque juin
      - Cumul des précipitations solides journalières de chaque juillet
      - Cumul des précipitations solides journalières de chaque août
      - Cumul des précipitations solides journalières de chaque septembre
      - Cumul des précipitations solides journalières de chaque octobre
      - Cumul des précipitations solides journalières de chaque novembre
      - Cumul des précipitations solides journalières de chaque décembre
    description: ""
    method:
      P1:
        RMAs_jan: agrégation mensuelle par année - somme
        RMAs_feb: agrégation mensuelle par année - somme
        RMAs_mar: agrégation mensuelle par année - somme
        RMAs_apr: agrégation mensuelle par année - somme
        RMAs_may: agrégation mensuelle par année - somme
        RMAs_jun: agrégation mensuelle par année - somme
        RMAs_jul: agrégation mensuelle par année - somme
        RMAs_aug: agrégation mensuelle par année - somme
        RMAs_sep: agrégation mensuelle par année - somme
        RMAs_oct: agrégation mensuelle par année - somme
        RMAs_nov: agrégation mensuelle par année - somme
        RMAs_dec: agrégation mensuelle par année - somme
    sampling_period:
      - ["01-01", "31-01"]
      - ["01-02", "28(29)-02"]
      - ["01-03", "31-03"]
      - ["01-04", "30-04"]
      - ["01-05", "31-05"]
      - ["01-06", "30-06"]
      - ["01-07", "31-07"]
      - ["01-08", "31-08"]
      - ["01-09", "30-09"]
      - ["01-10", "31-10"]
      - ["01-11", "30-11"]
      - ["01-12", "31-12"]
    classification:
      domain: précipitations
      phenomenon: neige
      aspect: intensité
      statistic:
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
        - somme
      season: par mois
      output: série

  global:
    input_vars: Rs
    relative: false
    palette: ["#452C1A", "#7F4A23", "#B3762A", "#D4B86A", "#EFE0B0",
              "#BCE6DB", "#7ACEB9", "#449C93", "#2A6863", "#193830"]

process:
  P1:
    func:
      RMAs: [nansum_strict, "Rs"]
    time_step: year-month
    max_na_pct: 3
    max_na_years: 10
    compress: true
